<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" role="img" aria-labelledby="triad-title triad-desc">
  <title id="triad-title">How ProjectOS Connects Decisions, Code Impact, and Git Commits</title>
  <desc id="triad-desc">Editorial diagram showing one shared Decision Record connecting Project Brain before coding, Change Impact Intelligence during planning, and AI Git after committing.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .spine { fill: #FFFFFF; stroke: #18181B; stroke-width: 1.75; }
      .card { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .badge-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .badge-amber { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1; }
      .badge-green { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .conn { fill: none; stroke: #71717A; stroke-width: 1.75; }
      .conn-dash { fill: none; stroke: #A1A1AA; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#71717A"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="316" rx="16" class="canvas"/>

  <!-- Top Shared Decision Record Spine -->
  <g transform="translate(240, 28)">
    <rect x="0" y="0" width="520" height="58" rx="12" class="spine"/>
    <circle cx="28" cy="29" r="6" fill="#2563EB"/>
    <text x="46" y="25" class="t-head" font-size="14.5">One Shared Decision Record</text>
    <text x="46" y="44" class="t-body" font-size="12.5">Stored once in SQLite · Referenced across every stage</text>
  </g>

  <!-- Vertical Connectors from Shared Record -->
  <path d="M 350 86 L 185 86 L 185 122" class="conn-dash"/>
  <path d="M 500 86 L 500 122" class="conn-dash"/>
  <path d="M 650 86 L 815 86 L 815 122" class="conn-dash"/>

  <!-- STAGE 1: BEFORE CODING (Project Brain) -->
  <g transform="translate(45, 126)">
    <rect x="0" y="0" width="280" height="150" rx="12" class="card"/>
    <rect x="20" y="18" width="128" height="24" rx="6" class="badge-blue"/>
    <text x="84" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#1D4ED8">1. BEFORE CODING</text>

    <text x="20" y="70" class="t-head" font-size="18">Project Brain</text>
    <text x="20" y="94" class="t-body" font-size="13.5">Retrieve human-approved rules</text>
    <text x="20" y="113" class="t-body" font-size="13.5">and design rationale.</text>
    <text x="20" y="136" class="t-mono" font-size="11.5" fill="#2563EB">“What did we already decide?”</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="325" y1="201" x2="354" y2="201" class="conn" marker-end="url(#ar)"/>

  <!-- STAGE 2: DURING PLANNING (Change Impact Intelligence) -->
  <g transform="translate(360, 126)">
    <rect x="0" y="0" width="280" height="150" rx="12" class="card"/>
    <rect x="20" y="18" width="136" height="24" rx="6" class="badge-amber"/>
    <text x="88" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#B45309">2. CHANGE PLANNING</text>

    <text x="20" y="70" class="t-head" font-size="18">Change Impact</text>
    <text x="20" y="94" class="t-body" font-size="13.5">Trace affected files and check</text>
    <text x="20" y="113" class="t-body" font-size="13.5">for decision conflicts.</text>
    <text x="20" y="136" class="t-mono" font-size="11.5" fill="#D97706">“What will this change affect?”</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="640" y1="201" x2="669" y2="201" class="conn" marker-end="url(#ar)"/>

  <!-- STAGE 3: AFTER COMMIT (AI Git) -->
  <g transform="translate(675, 126)">
    <rect x="0" y="0" width="280" height="150" rx="12" class="card"/>
    <rect x="20" y="18" width="124" height="24" rx="6" class="badge-green"/>
    <text x="82" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#047857">3. AFTER COMMIT</text>

    <text x="20" y="70" class="t-head" font-size="18">AI Git</text>
    <text x="20" y="94" class="t-body" font-size="13.5">Link real Git commits back to</text>
    <text x="20" y="113" class="t-body" font-size="13.5">the approved decision ID.</text>
    <text x="20" y="136" class="t-mono" font-size="11.5" fill="#059669">“Why was this commit made?”</text>
  </g>
</svg>
