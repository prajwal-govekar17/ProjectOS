<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t-core-features-triad d-core-features-triad">
<title id="t-core-features-triad">Three capabilities, one shared decision record</title>
<desc id="d-core-features-triad">The coding agent calls Project Brain, Change Impact Intelligence and AI Git independently, as needed. Each capability reads or writes shared records through the Express REST API, which stores them in PostgreSQL on Supabase. Future coding sessions retrieve the preserved context.</desc>
