<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t-ai-git-traceability d-ai-git-traceability">
<title id="t-ai-git-traceability">AI Git traceability</title>
<desc id="d-ai-git-traceability">After a normal developer commit, the agent or developer calls link_commit_to_decision. The local MCP server uses Git CLI to capture the full hash, parents and changed paths and sends them to Express over REST. Express checks that the decision is approved for the same project and avoids duplicates, then stores the association in PostgreSQL over TLS. The stored relationship connects decision version and rationale, association origin and provenance with optional file links, and the commit evidence, many-to-many. Lookups by decision_id, file_path or commit_hash through get_git_traceability or the AI Git timeline work in both directions. A commit with no applicable decision stays unlinked, which is valid.</desc>
