<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" width="1000" height="1160" role="img" aria-labelledby="t-workflow-decide d-workflow-decide">
<title id="t-workflow-decide">Workflow, part 2 — Decide</title>
<desc id="d-workflow-decide">Stage 03. A human reviews the plan and evidence. If the approach needs redesign, the agent revises it and re-runs analysis in Stage 02. If no new or replacement architectural decision is needed, work continues in Stage 04 without a proposal. Otherwise the agent submits a pending proposal with propose_decision and pauses; an authorized human reviews the exact version. Rejected proposals keep the existing rule and lead to revision or abandonment, pending proposals keep the work paused, and approved proposals let the developer resume the agent, which verifies status with get_decision_status before continuing to Stage 04. Trusted MCP elicitation is a planned P1 alternative review channel.</desc>
