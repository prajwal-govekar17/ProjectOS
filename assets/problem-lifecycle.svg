<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t-problem-lifecycle d-problem-lifecycle">
<title id="t-problem-lifecycle">Where architectural reasoning gets lost</title>
<desc id="d-problem-lifecycle">Three stages of AI-assisted development. Before a change, fragmented context can lead to inconsistent implementation. During change planning, missed dependents and unchecked decision conflicts can lead to rework. After a change, missing decision-to-commit traceability can lead to lost engineering reasoning.</desc>
<defs><marker id="arr-problem-lifecycle" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#A9B4B0"/></marker></defs>
<rect width="1000" height="560" rx="14" fill="#101413"/>
<text x="40" y="40" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#D7E3DF">Where architectural reasoning gets lost</text>
<rect x="670" y="70" width="290" height="470" rx="10" fill="none" stroke="#56685F" stroke-width="1.4" stroke-dasharray="7 5"/><text x="684" y="92" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#9FB2AA">3 · AFTER A CHANGE</text>
<rect x="355" y="70" width="290" height="470" rx="10" fill="none" stroke="#56685F" stroke-width="1.4" stroke-dasharray="7 5"/><text x="369" y="92" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#9FB2AA">2 · DURING CHANGE PLANNING</text>
<rect x="40" y="70" width="290" height="470" rx="10" fill="none" stroke="#56685F" stroke-width="1.4" stroke-dasharray="7 5"/><text x="54" y="92" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#9FB2AA">1 · BEFORE A CHANGE</text>
<g><rect x="75" y="108" width="220" height="46" rx="23" fill="#DBEAFE" stroke="#9FBDEB" stroke-width="1.5"/>
<text x="185" y="136.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">New coding session</text></g>
<g><rect x="60" y="184" width="250" height="84" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="185" y="213.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Context fragmentation</text>
<text x="185" y="231.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">decisions live in chats,</text>
<text x="185" y="249.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">documents and memory</text></g>
<g><rect x="60" y="298" width="250" height="66" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="185" y="327.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Agent starts without the rule</text>
<text x="185" y="345.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">approved decision not retrieved</text></g>
<g><rect x="60" y="420" width="250" height="84" rx="6" fill="#FCE7F3" stroke="#E4A9C9" stroke-width="1.5"/>
<text x="185" y="449.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Inconsistent implementation</text>
<text x="185" y="467.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">may contradict an approved</text>
<text x="185" y="485.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">decision</text></g>
