<g><rect x="390" y="108" width="220" height="46" rx="23" fill="#DBEAFE" stroke="#9FBDEB" stroke-width="1.5"/>
<text x="500" y="136.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Change requested</text></g>
<g><rect x="375" y="184" width="250" height="84" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="500" y="213.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Dependency blind spots</text>
<text x="500" y="231.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">search finds matches,</text>
<text x="500" y="249.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">not downstream consumers</text></g>
<g><rect x="375" y="298" width="250" height="66" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="500" y="327.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Conflicts go unchecked</text>
<text x="500" y="345.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">path-linked decisions missed</text></g>
<g><rect x="375" y="420" width="250" height="84" rx="6" fill="#FCE7F3" stroke="#E4A9C9" stroke-width="1.5"/>
<text x="500" y="449.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Possible rework</text>
<text x="500" y="467.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">indirect effects surface</text>
<text x="500" y="485.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">after editing</text></g>
<path d="M500,154 L500,184" fill="none" stroke="#A9B4B0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr-problem-lifecycle)"/>
<path d="M500,268 L500,298" fill="none" stroke="#A9B4B0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr-problem-lifecycle)"/>
<path d="M500,364 L500,420" fill="none" stroke="#A9B4B0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr-problem-lifecycle)"/>
<g><rect x="705" y="108" width="220" height="46" rx="23" fill="#DBEAFE" stroke="#9FBDEB" stroke-width="1.5"/>
<text x="815" y="136.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Code committed</text></g>
<g><rect x="690" y="184" width="250" height="84" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="815" y="213.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Traceability gap</text>
<text x="815" y="231.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">Git keeps hash, author</text>
<text x="815" y="249.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">and diff</text></g>
<g><rect x="690" y="298" width="250" height="66" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="815" y="327.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Reason is not recorded</text>
<text x="815" y="345.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">no link to the approved decision</text></g>
<g><rect x="690" y="420" width="250" height="84" rx="6" fill="#FCE7F3" stroke="#E4A9C9" stroke-width="1.5"/>
<text x="815" y="449.8" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Lost engineering reasoning</text>
<text x="815" y="467.9" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">why the code exists fades</text>
<text x="815" y="485.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">over time</text></g>
