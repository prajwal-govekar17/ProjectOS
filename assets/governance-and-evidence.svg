<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" width="100%" height="100%" role="img" aria-labelledby="gov-title gov-desc">
  <title id="gov-title">ProjectOS Human Approval Governance: P0 Dashboard Review vs. P1 Trusted MCP Elicitation</title>
  <desc id="gov-desc">Comparison diagram illustrating the P0 Primary Dashboard Approval &amp; Manual Resumption workflow alongside the P1 Trusted In-Client MCP Elicitation workflow with fail-closed fallback to the authenticated dashboard.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .panel-p0 { fill: #0B191E; stroke: #10B981; stroke-width: 1.75; }
      .panel-p1 { fill: #12162B; stroke: #6366F1; stroke-width: 1.5; }
      .box { fill: #0F172A; stroke: #263554; stroke-width: 1.25; }
      .box-service { fill: #0C253A; stroke: #38BDF8; stroke-width: 1.75; }
      .tag-e { fill: #064E3B; stroke: #059669; stroke-width: 1; }
      .tag-p { fill: #1E1B4B; stroke: #4F46E5; stroke-width: 1; }
      .tag-r { fill: #3F121D; stroke: #E11D48; stroke-width: 1; }
      .t-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .w-e { fill: none; stroke: #10B981; stroke-width: 1.75; }
      .w-p { fill: none; stroke: #818CF8; stroke-width: 1.75; }
      .w-fb { fill: none; stroke: #F59E0B; stroke-width: 1.75; stroke-dasharray: 5 4; }
    </style>
    <marker id="ag-e" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="ag-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <marker id="ag-fb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1160" height="390" rx="14" class="bg"/>

  <!-- Header -->
  <text x="28" y="32" class="t-main" font-size="16" font-weight="700">Human Approval Governance: P0 Dashboard-First Path &amp; P1 Trusted MCP Elicitation</text>
  <text x="28" y="51" class="t-muted" font-size="12">Security Boundary (PB-05..PB-08): Scoped MCP agent credentials can never approve proposals. Both review paths use one backend review service.</text>

  <!-- ========================================================= -->
  <!-- LEFT PANEL: P0 PRIMARY DASHBOARD APPROVAL & RESUME        -->
  <!-- ========================================================= -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="542" height="298" rx="10" class="panel-p0"/>
    <rect x="16" y="14" width="276" height="20" rx="4" class="tag-e"/>
    <text x="154" y="28" text-anchor="middle" fill="#6EE7B7" class="t-mono" font-size="10" font-weight="700">P0 PRIMARY PATH • DASHBOARD + MANUAL RESUME</text>

    <!-- Step A: propose_decision -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="242" height="76" rx="8" class="box"/>
      <text x="12" y="19" fill="#34D399" class="t-mono" font-size="9" font-weight="700">1. AGENT SUBMITS PROPOSAL</text>
      <text x="12" y="37" class="t-main t-mono" font-size="11.5" font-weight="700">propose_decision()</text>
      <text x="12" y="53" class="t-muted" font-size="10">Saves DEC-004 (status: pending);</text>
      <text x="12" y="67" class="t-muted" font-size="10">returns ID, version &amp; review URL.</text>
    </g>

    <!-- Step B: Agent stops -->
    <g transform="translate(284, 48)">
      <rect x="0" y="0" width="242" height="76" rx="8" class="box"/>
      <text x="12" y="19" fill="#34D399" class="t-mono" font-size="9" font-weight="700">2. AGENT PAUSES CLEANLY</text>
      <text x="12" y="37" class="t-main" font-size="12" font-weight="700">No Continuous Polling</text>
      <text x="12" y="53" class="t-muted" font-size="10">Codex stops architectural work; no</text>
      <text x="12" y="67" class="t-muted" font-size="10">open DB transaction or loop.</text>
    </g>

    <path d="M 258 86 L 280 86" class="w-e" marker-end="url(#ag-e)"/>

    <!-- Step C: Human reviews in Dashboard -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="242" height="82" rx="8" class="box-service"/>
      <text x="12" y="19" fill="#7DD3FC" class="t-mono" font-size="9" font-weight="700">3. AUTHENTICATED HUMAN REVIEW</text>
      <text x="12" y="37" class="t-main" font-size="12" font-weight="700">React Dashboard + Express Session</text>
      <text x="12" y="53" class="t-muted" font-size="10">Human inspects IMP-002 &amp; approves</text>
      <text x="12" y="68" class="t-muted" font-size="10">or rejects exact proposal version.</text>
    </g>

    <!-- Step D: Manual Resumption -->
    <g transform="translate(284, 142)">
      <rect x="0" y="0" width="242" height="82" rx="8" class="box"/>
      <text x="12" y="19" fill="#34D399" class="t-mono" font-size="9" font-weight="700">4. SINGLE STATUS LOOKUP</text>
      <text x="12" y="37" class="t-main t-mono" font-size="11.5" font-weight="700">get_decision_status()</text>
      <text x="12" y="53" class="t-muted" font-size="10">When developer resumes Codex,</text>
      <text x="12" y="68" class="t-muted" font-size="10">agent verifies persisted outcome.</text>
    </g>

    <path d="M 258 183 L 280 183" class="w-e" marker-end="url(#ag-e)"/>

    <!-- P0 Security Rejections Bar -->
    <g transform="translate(16, 236)">
      <rect x="0" y="0" width="510" height="48" rx="6" class="tag-r"/>
      <text x="14" y="19" fill="#FDA4AF" class="t-mono" font-size="9.5" font-weight="700">✕ REJECTED BY BACKEND REVIEW SERVICE (HTTP 401 / 403 / 409)</text>
      <text x="14" y="36" fill="#FECDD3" class="t-muted" font-size="10.5">Direct agent credentials · Forged approval tool args · Stale version · Replayed review</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: P1 TRUSTED MCP ELICITATION + FALLBACK        -->
  <!-- ========================================================= -->
  <g transform="translate(594, 68)">
    <rect x="0" y="0" width="542" height="298" rx="10" class="panel-p1"/>
    <rect x="16" y="14" width="320" height="20" rx="4" class="tag-p"/>
    <text x="176" y="28" text-anchor="middle" fill="#C7D2FE" class="t-mono" font-size="10" font-weight="700">P1 ENHANCEMENT (AFTER LOCAL GATE) • MCP ELICITATION</text>

    <!-- Step 1: Persist first, then elicit -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="242" height="76" rx="8" class="box"/>
      <text x="12" y="19" fill="#A5B4FC" class="t-mono" font-size="9" font-weight="700">1. PERSIST PENDING FIRST</text>
      <text x="12" y="37" class="t-main t-mono" font-size="11.5" font-weight="700">propose_decision()</text>
      <text x="12" y="53" class="t-muted" font-size="10">Saves pending record in SQLite first;</text>
      <text x="12" y="67" class="t-muted" font-size="10">negotiates client elicitation support.</text>
    </g>

    <!-- Step 2: Server-requested elicitation/create -->
    <g transform="translate(284, 48)">
      <rect x="0" y="0" width="242" height="76" rx="8" class="box"/>
      <text x="12" y="19" fill="#A5B4FC" class="t-mono" font-size="9" font-weight="700">2. PROTOCOL HUMAN PROMPT</text>
      <text x="12" y="37" class="t-main t-mono" font-size="11.5" font-weight="700">elicitation/create</text>
      <text x="12" y="53" class="t-muted" font-size="10">Client (not LLM) shows proposal,</text>
      <text x="12" y="67" class="t-muted" font-size="10">rationale &amp; report to human user.</text>
    </g>

    <path d="M 258 86 L 280 86" class="w-p" marker-end="url(#ag-p)"/>

    <!-- Step 3A: Trusted Reviewer-Bound Channel -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="242" height="82" rx="8" class="box-service"/>
      <text x="12" y="19" fill="#7DD3FC" class="t-mono" font-size="9" font-weight="700">3A. IF TRUSTED &amp; AUTHORIZED</text>
      <text x="12" y="37" class="t-main" font-size="12" font-weight="700">Same Backend Review Service</text>
      <text x="12" y="53" class="t-muted" font-size="10">Verifies reviewer binding, version &amp;</text>
      <text x="12" y="68" class="t-muted" font-size="10">expiry; returns approved/rejected.</text>
    </g>

    <!-- Step 3B: Fail Closed to Dashboard -->
    <g transform="translate(284, 142)">
      <rect x="0" y="0" width="242" height="82" rx="8" class="box"/>
      <text x="12" y="19" fill="#FBBF24" class="t-mono" font-size="9" font-weight="700">3B. FAIL CLOSED FALLBACK</text>
      <text x="12" y="37" class="t-main" font-size="12" font-weight="700">Remain Pending → Dashboard</text>
      <text x="12" y="53" class="t-muted" font-size="10">If cancelled, timed out, deferred,</text>
      <text x="12" y="68" class="t-muted" font-size="10">unsupported or untrusted channel.</text>
    </g>

    <!-- Fallback Dashed Arrow from P1 to P0 -->
    <path d="M 284 236 L 566 236" class="w-fb"/>
    <g transform="translate(16, 236)">
      <rect x="0" y="0" width="510" height="48" rx="6" fill="#090D16" stroke="#334155"/>
      <text x="14" y="19" fill="#FCD34D" class="t-mono" font-size="9.5" font-weight="700">⚠ FAIL-CLOSED TRUST RULE (PRD SECTION 3)</text>
      <text x="14" y="36" class="t-muted" font-size="10.5">Never accept a model-supplied boolean as human input. When reviewer identity is unverified, use P0 Dashboard.</text>
    </g>
  </g>

  <rect x="1" y="1" width="1158" height="388" rx="13" class="frame"/>
</svg>
