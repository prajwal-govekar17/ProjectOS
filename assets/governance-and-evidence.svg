<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="100%" role="img" aria-labelledby="gov-title gov-desc">
  <title id="gov-title">ProjectOS Human Approval Boundary</title>
  <desc id="gov-desc">Diagram showing the human approval gate: an AI coding agent submits a pending decision proposal via propose_decision, an authorized human approves or rejects it in the dashboard (P0) or via trusted elicitation (P1), and the agent checks the outcome via get_decision_status.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .card { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .card-gate { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .badge-amber { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.25; }
      .badge-green { fill: #FFFFFF; stroke: #059669; stroke-width: 1.25; }
      .badge-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.25; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .line { fill: none; stroke: #52525B; stroke-width: 1.75; }
      .line-green { fill: none; stroke: #059669; stroke-width: 2; }
    </style>
    <marker id="ar-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#52525B"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="306" rx="16" class="canvas"/>

  <!-- Top Section Label -->
  <text x="44" y="42" class="t-mono" font-size="11.5" fill="#52525B" letter-spacing="0.8">ARCHITECTURAL GOVERNANCE · AGENTS PROPOSE, HUMANS APPROVE</text>

  <!-- Step 1: Agent Submits Pending Proposal -->
  <g transform="translate(44, 68)">
    <rect x="0" y="0" width="260" height="164" rx="12" class="card"/>
    <rect x="20" y="18" width="144" height="24" rx="6" class="badge-amber"/>
    <text x="92" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#B45309">1. PENDING PROPOSAL</text>

    <text x="20" y="70" class="t-head" font-size="17">Agent Proposes Rule</text>
    <text x="20" y="94" class="t-mono" font-size="12.5" fill="#2563EB">propose_decision()</text>
    <text x="20" y="118" class="t-body" font-size="13">Saved as <tspan class="t-mono" font-size="12">pending</tspan> (DEC-004).</text>
    <text x="20" y="138" class="t-body" font-size="13">Agent pauses; no polling loop.</text>
  </g>

  <line x1="304" y1="150" x2="358" y2="150" class="line" marker-end="url(#ar-g)"/>

  <!-- Step 2: Authorized Human Governance Gate -->
  <g transform="translate(364, 68)">
    <rect x="0" y="0" width="272" height="164" rx="12" class="card-gate"/>
    <rect x="20" y="18" width="176" height="24" rx="6" class="badge-green"/>
    <text x="108" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#047857">2. HUMAN APPROVAL GATE</text>

    <text x="20" y="70" class="t-head" font-size="17" fill="#064E3B">Human Reviewer Decides</text>
    <text x="20" y="95" class="t-body" font-size="13" fill="#065F46"><tspan class="t-head" fill="#064E3B">P0 Primary:</tspan> Web Dashboard</text>
    <text x="20" y="116" class="t-body" font-size="13" fill="#065F46"><tspan class="t-head" fill="#064E3B">P1 Later:</tspan> Trusted Elicitation</text>
    <text x="20" y="140" class="t-mono" font-size="11.5" fill="#047857">Agent credentials cannot approve</text>
  </g>

  <line x1="636" y1="150" x2="690" y2="150" class="line-green" marker-end="url(#ar-ok)"/>

  <!-- Step 3: Agent Verifies Status & Resumes -->
  <g transform="translate(696, 68)">
    <rect x="0" y="0" width="260" height="164" rx="12" class="card"/>
    <rect x="20" y="18" width="152" height="24" rx="6" class="badge-blue"/>
    <text x="96" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#1D4ED8">3. VERIFY &amp; RESUME</text>

    <text x="20" y="70" class="t-head" font-size="17">Single Status Check</text>
    <text x="20" y="94" class="t-mono" font-size="12.5" fill="#2563EB">get_decision_status()</text>
    <text x="20" y="118" class="t-body" font-size="13">Confirms <tspan class="t-mono" font-size="12">approved</tspan> version</text>
    <text x="20" y="138" class="t-body" font-size="13">before writing feature code.</text>
  </g>

  <!-- Bottom Fail-Closed Caption -->
  <text x="44" y="272" class="t-body" font-size="13">
    <tspan class="t-head">Fail-closed guarantee:</tspan> If a review is cancelled, timed out, or untrusted, the proposal remains <tspan class="t-mono" font-size="12">pending</tspan> for dashboard review.
  </text>
</svg>
