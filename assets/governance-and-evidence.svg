<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="1000" height="1080" role="img" aria-labelledby="t-governance-and-evidence d-governance-and-evidence">
<title id="t-governance-and-evidence">Human approval governance</title>
<desc id="d-governance-and-evidence">The agent calls propose_decision through the MCP server; Express validates it and persists a pending proposal in PostgreSQL. In P0, the agent receives the proposal ID, version and review link, pauses without polling, and an authorized human reviews in the authenticated dashboard. In planned P1, the server requests human input through MCP elicitation and the client shows the exact proposal; untrusted, cancelled or deferred responses stay pending and fall back to the dashboard. Both channels use the same backend review service inside the human authorization boundary; an ordinary agent credential cannot approve. The outcome is persisted, the agent learns the status, then continues, revises or stays paused.</desc>
