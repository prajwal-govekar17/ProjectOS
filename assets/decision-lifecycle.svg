<text x="500" y="664.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">active, authoritative</text></g>
<g><rect x="700" y="620" width="240" height="60" rx="18" fill="#FCE7F3" stroke="#E4A9C9" stroke-width="1.5"/>
<text x="820" y="646.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Superseded</text>
<text x="820" y="664.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">history stays readable</text></g>
