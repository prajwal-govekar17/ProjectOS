<text x="500" y="175.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#334155">Changes an</text>
<text x="500" y="195.1" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#334155">architectural</text>
<text x="500" y="214.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#334155">decision?</text></g>
<g><rect x="700" y="162" width="240" height="56" rx="28" fill="#DBEAFE" stroke="#9FBDEB" stroke-width="1.5"/>
<text x="820" y="186.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">No proposal needed</text>
<text x="820" y="204.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">routine change (PB-08)</text></g>
<g><rect x="390" y="272" width="220" height="60" rx="6" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="500" y="298.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Proposal submitted</text>
<text x="500" y="316.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">new rule or replacement</text></g>
<g><rect x="390" y="362" width="220" height="60" rx="18" fill="#CCF5E4" stroke="#8ED6B9" stroke-width="1.5"/>
<text x="500" y="388.5" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Pending</text>
<text x="500" y="406.6" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5A6C">stored, not authoritative</text></g>
