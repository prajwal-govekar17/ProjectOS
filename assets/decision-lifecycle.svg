<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t-decision-lifecycle d-decision-lifecycle">
<title id="t-decision-lifecycle">Project Brain decision lifecycle</title>
<desc id="d-decision-lifecycle">A planned change that does not alter an architectural decision needs no proposal. Otherwise a proposal is submitted and stored as pending. An authorized human reviews the exact version: rejection records it as rejected and leaves the active rule unchanged; approval makes it the active decision; deferred, cancelled, timed-out or untrusted reviews leave it pending. When a replacement is approved, its predecessor becomes superseded in the same transaction. Rejected, approved and superseded decisions remain in PostgreSQL history with their linked commits.</desc>
<defs><marker id="arr-decision-lifecycle" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#A9B4B0"/></marker></defs>
<rect width="1000" height="860" rx="14" fill="#101413"/>
<text x="40" y="40" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#D7E3DF">Project Brain decision lifecycle</text>
<g><rect x="390" y="70" width="220" height="44" rx="22" fill="#DBEAFE" stroke="#9FBDEB" stroke-width="1.5"/>
<text x="500" y="97.3" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Planned change</text></g>
