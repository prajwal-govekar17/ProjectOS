<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" width="1000" height="910" role="img" aria-labelledby="t-deployment-architecture d-deployment-architecture">
<title id="t-deployment-architecture">Deployment phases</title>
<desc id="d-deployment-architecture">P0, the current target: the coding agent, MCP server, ts-morph, Git CLI, local repository, Express API and React dashboard all run on the developer machine, and Express connects over TLS to PostgreSQL hosted on Supabase. P1, planned and not yet implemented: the agent, MCP server and repository tools stay local; AWS EC2 hosts the Express API and the built React app, with Amazon EBS as instance storage; PostgreSQL stays on Supabase. Application traffic uses HTTPS and database traffic uses TLS.</desc>
