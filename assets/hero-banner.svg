<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t-hero-banner d-hero-banner">
<title id="t-hero-banner">ProjectOS at a glance</title>
<desc id="d-hero-banner">A developer works with an MCP-compatible coding agent, which calls the local ProjectOS MCP server. The MCP server uses ts-morph and Git CLI on the local repository and talks to the Express API over REST. Express owns the PostgreSQL database on Supabase. The developer reviews and approves architectural decisions in the dashboard, which also talks to Express over REST.</desc>
