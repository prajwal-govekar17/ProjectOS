<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ProjectOS — Architectural memory, impact analysis, and Git traceability for AI coding agents</title>
  <desc id="hero-desc">Minimal editorial hero diagram showing an AI coding agent connecting through Model Context Protocol (MCP) to Project Brain, Change Impact Intelligence, and AI Git.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .node { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .node-mcp { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; }
      .pill-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.25; }
      .pill-amber { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1.25; }
      .pill-green { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1.25; }
      .t-title { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 800; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-cap { fill: #71717A; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .line { fill: none; stroke: #52525B; stroke-width: 1.75; }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2; }
      .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#52525B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Warm Neutral Editorial Canvas -->
  <rect x="2" y="2" width="996" height="316" rx="16" class="canvas"/>

  <!-- LEFT: Minimal Editorial Identity -->
  <g transform="translate(56, 62)">
    <text x="0" y="16" class="t-cap" font-size="11.5" letter-spacing="1.2" fill="#2563EB">MODEL CONTEXT PROTOCOL · DEVELOPER TOOL</text>

    <text x="0" y="72" class="t-title" font-size="48" letter-spacing="-1.2">ProjectOS</text>

    <text x="0" y="114" class="t-head" font-size="18" fill="#27272A">
      Architectural memory and impact analysis
    </text>
    <text x="0" y="140" class="t-head" font-size="18" fill="#27272A">
      for AI-assisted software development.
    </text>

    <text x="0" y="178" class="t-body" font-size="14">
      Keep human-approved decisions, real code dependencies,
    </text>
    <text x="0" y="198" class="t-body" font-size="14">
      and Git commit reasons connected across coding sessions.
    </text>
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="464" y1="44" x2="464" y2="276" stroke="#E7E5E4" stroke-width="1.5"/>

  <!-- RIGHT: Clean 3-Part Architectural Diagram -->
  <g transform="translate(496, 42)">
    <!-- 1. Coding Agent Node (Left) -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="124" height="80" rx="10" class="node"/>
      <!-- Terminal Icon -->
      <rect x="46" y="14" width="32" height="22" rx="4" class="icon" stroke="#18181B"/>
      <path d="M 53 22 L 57 25 L 53 28 M 61 28 L 67 28" class="icon" stroke="#18181B" stroke-width="1.75"/>
      <text x="62" y="54" text-anchor="middle" class="t-head" font-size="13.5">Coding Agent</text>
      <text x="62" y="70" text-anchor="middle" class="t-body" font-size="11.5">Codex / IDE</text>
    </g>

    <!-- Arrow Agent <-> MCP -->
    <line x1="128" y1="118" x2="168" y2="118" class="line-blue" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>

    <!-- 2. MCP Hub Node (Center) -->
    <g transform="translate(174, 78)">
      <rect x="0" y="0" width="104" height="80" rx="10" class="node-mcp"/>
      <circle cx="52" cy="25" r="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.75"/>
      <circle cx="52" cy="25" r="3.5" fill="#2563EB"/>
      <text x="52" y="54" text-anchor="middle" class="t-head" font-size="13.5" fill="#1D4ED8">MCP</text>
      <text x="52" y="70" text-anchor="middle" class="t-cap" font-size="10.5" fill="#2563EB">7 TOOLS</text>
    </g>

    <!-- Branching Connector MCP -> 3 Pillars -->
    <path d="M 278 118 L 302 118 M 302 36 L 302 200 M 302 36 L 324 36 M 302 118 L 324 118 M 302 200 L 324 200" class="line" marker-end="url(#arr)"/>

    <!-- 3. Three Core Pillars (Right) -->
    <!-- Pillar A: Project Brain -->
    <g transform="translate(330, 6)">
      <rect x="0" y="0" width="136" height="60" rx="10" class="pill-blue"/>
      <text x="16" y="26" class="t-head" font-size="13.5" fill="#1E3A8A">Project Brain</text>
      <text x="16" y="45" class="t-body" font-size="11.5" fill="#1E40AF">Approved decisions</text>
    </g>

    <!-- Pillar B: Change Impact -->
    <g transform="translate(330, 88)">
      <rect x="0" y="0" width="136" height="60" rx="10" class="pill-amber"/>
      <text x="16" y="26" class="t-head" font-size="13.5" fill="#78350F">Change Impact</text>
      <text x="16" y="45" class="t-body" font-size="11.5" fill="#92400E">Code dependencies</text>
    </g>

    <!-- Pillar C: AI Git -->
    <g transform="translate(330, 170)">
      <rect x="0" y="0" width="136" height="60" rx="10" class="pill-green"/>
      <text x="16" y="26" class="t-head" font-size="13.5" fill="#064E3B">AI Git</text>
      <text x="16" y="45" class="t-body" font-size="11.5" fill="#065F46">Commit provenance</text>
    </g>
  </g>
</svg>
