<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ProjectOS System Architecture and Boundaries</title>
  <desc id="arch-desc">Clean architectural diagram showing the local developer environment (Developer, Coding Agent, ProjectOS MCP Server, ts-morph, Git CLI, and Local Repository) connected via REST APIs to the Express 5 Backend, SQLite Database, and React Dashboard.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .zone { fill: #F5F3EF; stroke: #D6D3D1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .box-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; }
      .box-green { fill: #FFFFFF; stroke: #059669; stroke-width: 1.75; }
      .pill { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .pill-green { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .line { fill: none; stroke: #52525B; stroke-width: 1.75; }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2; }
      .line-green { fill: none; stroke: #059669; stroke-width: 2; }
    </style>
    <marker id="m-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#52525B"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563EB"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="386" rx="16" class="canvas"/>

  <!-- LEFT ZONE: Local Developer Environment -->
  <rect x="28" y="30" width="490" height="330" rx="12" class="zone"/>
  <text x="46" y="54" class="t-mono" font-size="11" fill="#52525B" letter-spacing="0.8">LOCAL DEVELOPER WORKSTATION (ALWAYS LOCAL)</text>

  <!-- Developer + Coding Agent -->
  <g transform="translate(46, 76)">
    <rect x="0" y="0" width="180" height="86" rx="10" class="box"/>
    <text x="16" y="26" class="t-mono" font-size="10" fill="#71717A">IDE / TERMINAL</text>
    <text x="16" y="48" class="t-head" font-size="15">AI Coding Agent</text>
    <text x="16" y="68" class="t-body" font-size="12.5">Codex (External LLM)</text>
  </g>

  <!-- ProjectOS MCP Server -->
  <g transform="translate(296, 76)">
    <rect x="0" y="0" width="198" height="86" rx="10" class="box-blue"/>
    <text x="16" y="26" class="t-mono" font-size="10" fill="#2563EB">TYPESCRIPT MCP SDK</text>
    <text x="16" y="48" class="t-head" font-size="15">ProjectOS MCP Server</text>
    <text x="16" y="68" class="t-body" font-size="12.5">Exposes 7 ProjectOS tools</text>
  </g>

  <!-- MCP Protocol Arrow -->
  <line x1="230" y1="119" x2="290" y2="119" class="line-blue" marker-start="url(#m-blue)" marker-end="url(#m-blue)"/>
  <rect x="241" y="94" width="40" height="18" rx="4" class="pill"/>
  <text x="261" y="107" text-anchor="middle" class="t-mono" font-size="10" fill="#1D4ED8">MCP</text>

  <!-- Independent Local Adapters: ts-morph and Git CLI -->
  <g transform="translate(296, 198)">
    <rect x="0" y="0" width="92" height="58" rx="8" class="box"/>
    <text x="46" y="26" text-anchor="middle" class="t-head" font-size="13">ts-morph</text>
    <text x="46" y="44" text-anchor="middle" class="t-body" font-size="11">JS/TS AST</text>
  </g>

  <g transform="translate(402, 198)">
    <rect x="0" y="0" width="92" height="58" rx="8" class="box"/>
    <text x="46" y="26" text-anchor="middle" class="t-head" font-size="13">Git CLI</text>
    <text x="46" y="44" text-anchor="middle" class="t-body" font-size="11">Commits</text>
  </g>

  <!-- Independent Arrows from MCP Server to Adapters -->
  <line x1="342" y1="162" x2="342" y2="193" class="line" marker-end="url(#m-gray)"/>
  <line x1="448" y1="162" x2="448" y2="193" class="line" marker-end="url(#m-gray)"/>

  <!-- Local Git Repository -->
  <g transform="translate(46, 282)">
    <rect x="0" y="0" width="448" height="58" rx="10" class="box"/>
    <text x="20" y="26" class="t-head" font-size="14.5">Local Git Repository</text>
    <text x="20" y="45" class="t-body" font-size="12">Source files and .git history stay on the developer machine</text>
  </g>

  <!-- Arrows into Local Repo -->
  <line x1="342" y1="256" x2="342" y2="277" class="line" marker-end="url(#m-gray)"/>
  <line x1="448" y1="256" x2="448" y2="277" class="line" marker-end="url(#m-gray)"/>
  <line x1="136" y1="162" x2="136" y2="277" class="line" marker-end="url(#m-gray)"/>
  <text x="128" y="224" text-anchor="end" class="t-body" font-size="11.5">Normal edits &amp; git commit</text>

  <!-- RIGHT ZONE: Shared Application Service -->
  <rect x="572" y="30" width="400" height="330" rx="12" class="zone"/>
  <text x="590" y="54" class="t-mono" font-size="11" fill="#52525B" letter-spacing="0.8">APPLICATION LAYER (LOCAL FIRST · LATER AWS EC2)</text>

  <!-- Express 5 Backend -->
  <g transform="translate(592, 76)">
    <rect x="0" y="0" width="360" height="86" rx="10" class="box"/>
    <text x="20" y="26" class="t-mono" font-size="10" fill="#2563EB">NODE.JS · EXPRESS 5 · ZOD</text>
    <text x="20" y="48" class="t-head" font-size="15">Express REST API &amp; Domain Services</text>
    <text x="20" y="68" class="t-body" font-size="12">Owns project auth and human-only approval rules</text>
  </g>

  <!-- Bridge: MCP Server <-> Express API -->
  <line x1="498" y1="119" x2="587" y2="119" class="line-blue" marker-start="url(#m-blue)" marker-end="url(#m-blue)"/>
  <rect x="520" y="94" width="50" height="18" rx="4" class="pill"/>
  <text x="545" y="107" text-anchor="middle" class="t-mono" font-size="10" fill="#1D4ED8">REST</text>

  <!-- SQLite Database -->
  <g transform="translate(592, 198)">
    <rect x="0" y="0" width="170" height="142" rx="10" class="box"/>
    <text x="16" y="28" class="t-mono" font-size="10" fill="#71717A">PERSISTENT STORE</text>
    <text x="16" y="50" class="t-head" font-size="15">SQLite Database</text>
    <text x="16" y="74" class="t-body" font-size="11.5">• Approved decisions</text>
    <text x="16" y="94" class="t-body" font-size="11.5">• Impact reports</text>
    <text x="16" y="114" class="t-body" font-size="11.5">• Git commit links</text>
  </g>

  <!-- React Dashboard -->
  <g transform="translate(778, 198)">
    <rect x="0" y="0" width="174" height="142" rx="10" class="box-green"/>
    <text x="16" y="28" class="t-mono" font-size="10" fill="#059669">REACT · VITE</text>
    <text x="16" y="50" class="t-head" font-size="15">Web Dashboard</text>
    <text x="16" y="74" class="t-body" font-size="11.5">• Decision review</text>
    <text x="16" y="94" class="t-body" font-size="11.5">• React Flow graph</text>
    <text x="16" y="114" class="t-body" font-size="11.5">• AI Git timeline</text>
  </g>

  <!-- Arrows Express <-> SQLite and Express <-> Dashboard -->
  <line x1="676" y1="166" x2="676" y2="193" class="line" marker-start="url(#m-gray)" marker-end="url(#m-gray)"/>
  <line x1="866" y1="166" x2="866" y2="193" class="line-green" marker-start="url(#m-green)" marker-end="url(#m-green)"/>
  <rect x="876" y="171" width="64" height="18" rx="4" class="pill-green"/>
  <text x="908" y="184" text-anchor="middle" class="t-mono" font-size="9.5" fill="#047857">SESSION</text>
</svg>
