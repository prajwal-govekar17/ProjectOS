<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="1000" height="950" role="img" aria-labelledby="t-system-architecture d-system-architecture">
<title id="t-system-architecture">System architecture</title>
<desc id="d-system-architecture">Four layers. Layer 1: developer, MCP-compatible coding agent and external LLM reasoning. Layer 2: local ProjectOS MCP server built with the official TypeScript MCP SDK, which independently invokes ts-morph and Git CLI on the registered local Git repository. Layer 3: Express 5 REST API with Zod validation, authentication and authorization, and domain services, connected over TLS to PostgreSQL hosted on Supabase. Layer 4: React dashboard with independent views. The MCP server and the dashboard both talk to Express over REST.</desc>
