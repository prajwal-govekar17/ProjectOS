<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" height="100%" role="img" aria-labelledby="tf-title tf-desc">
  <title id="tf-title">TeamFlow Change Impact Analysis: Verified Code Dependencies vs. AI Predictions</title>
  <desc id="tf-desc">Editorial diagram of Report IMP-001 in TeamFlow showing the two-hop ts-morph dependency path from taskAssignmentService.ts to taskRoutes.ts, bulkTaskService.ts, and projectOperations.ts alongside decision DEC-001, separated from AI predictions.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .panel-fact { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .panel-pred { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.75; stroke-dasharray: 6 4; }
      .node { fill: #FFFFFF; stroke: #18181B; stroke-width: 1.75; }
      .node-dep { fill: #F8FAFC; stroke: #475569; stroke-width: 1.5; }
      .node-dec { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.75; }
      .card-pred { fill: #FFFFFF; stroke: #FCD34D; stroke-width: 1.5; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .edge { fill: none; stroke: #18181B; stroke-width: 1.75; }
      .edge-blue { fill: none; stroke: #2563EB; stroke-width: 1.75; }
    </style>
    <marker id="ar-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#18181B"/>
    </marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="326" rx="16" class="canvas"/>

  <!-- LEFT: Verified Repository & Decision Evidence -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="628" height="274" rx="12" class="panel-fact"/>
    <text x="22" y="30" class="t-mono" font-size="11" fill="#059669" letter-spacing="0.6">VERIFIED EVIDENCE (ts-morph AST + PROJECT BRAIN)</text>

    <!-- 0-Hop Starting File -->
    <g transform="translate(20, 64)">
      <rect x="0" y="0" width="204" height="68" rx="8" class="node"/>
      <text x="12" y="23" class="t-mono" font-size="10" fill="#71717A">STARTING FILE (0-HOP)</text>
      <text x="12" y="46" class="t-mono" font-size="11" fill="#18181B">taskAssignmentService.ts</text>
    </g>

    <!-- Linked Decision DEC-001 -->
    <g transform="translate(20, 176)">
      <rect x="0" y="0" width="204" height="72" rx="8" class="node-dec"/>
      <text x="12" y="23" class="t-mono" font-size="10" fill="#2563EB">APPROVED RULE · DEC-001</text>
      <text x="12" y="44" class="t-head" font-size="12.5" fill="#1E3A8A">Manager-only approval</text>
      <text x="12" y="61" class="t-body" font-size="11.5" fill="#1E40AF">for task ownership</text>
    </g>

    <!-- Edge DEC-001 -> Starting File -->
    <line x1="122" y1="176" x2="122" y2="137" class="edge-blue" marker-end="url(#ar-b)"/>

    <!-- 1-Hop Direct Dependent A: taskRoutes.ts -->
    <g transform="translate(254, 52)">
      <rect x="0" y="0" width="164" height="62" rx="8" class="node-dep"/>
      <text x="14" y="22" class="t-mono" font-size="10" fill="#059669">1-HOP · E-001</text>
      <text x="14" y="43" class="t-mono" font-size="11.5" fill="#18181B">taskRoutes.ts</text>
    </g>

    <!-- 1-Hop Direct Dependent B: bulkTaskService.ts -->
    <g transform="translate(254, 146)">
      <rect x="0" y="0" width="164" height="62" rx="8" class="node-dep"/>
      <text x="14" y="22" class="t-mono" font-size="10" fill="#059669">1-HOP · E-002</text>
      <text x="14" y="43" class="t-mono" font-size="11.5" fill="#18181B">bulkTaskService.ts</text>
    </g>

    <!-- 2-Hop Indirect Dependent: projectOperations.ts -->
    <g transform="translate(446, 146)">
      <rect x="0" y="0" width="162" height="62" rx="8" class="node-dep"/>
      <text x="12" y="22" class="t-mono" font-size="10" fill="#059669">2-HOP · E-003</text>
      <text x="12" y="43" class="t-mono" font-size="11" fill="#18181B">projectOperations.ts</text>
    </g>

    <!-- Arrows between Files -->
    <path d="M 224 88 L 238 88 L 238 83 L 249 83" class="edge" marker-end="url(#ar-dark)"/>
    <path d="M 224 112 L 238 112 L 238 177 L 249 177" class="edge" marker-end="url(#ar-dark)"/>
    <line x1="418" y1="177" x2="441" y2="177" class="edge" marker-end="url(#ar-dark)"/>

    <text x="254" y="244" class="t-body" font-size="11.5">
      Verified dependency ≠ guaranteed edit or breakage
    </text>
  </g>

  <!-- RIGHT: Separately Stored AI Predictions -->
  <g transform="translate(676, 28)">
    <rect x="0" y="0" width="296" height="274" rx="12" class="panel-pred"/>
    <text x="20" y="30" class="t-mono" font-size="11" fill="#B45309" letter-spacing="0.6">AI PREDICTIONS (SEPARATE)</text>

    <!-- Prediction 1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="256" height="92" rx="8" class="card-pred"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#D97706">HYPOTHESIS · CONFLICT</text>
      <text x="14" y="44" class="t-head" font-size="13">Conflicts with DEC-001</text>
      <text x="14" y="64" class="t-body" font-size="12">Auto-reassignment bypasses</text>
      <text x="14" y="80" class="t-body" font-size="12">manager approval.</text>
    </g>

    <!-- Prediction 2 -->
    <g transform="translate(20, 158)">
      <rect x="0" y="0" width="256" height="92" rx="8" class="card-pred"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#D97706">HYPOTHESIS · MISSING UI</text>
      <text x="14" y="44" class="t-head" font-size="13">Leave-Status Interface</text>
      <text x="14" y="64" class="t-body" font-size="12">Employees need a way to</text>
      <text x="14" y="80" class="t-body" font-size="12">mark unavailability.</text>
    </g>
  </g>
</svg>
