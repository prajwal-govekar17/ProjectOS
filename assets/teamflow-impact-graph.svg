<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="100%" height="100%" role="img" aria-labelledby="tf-title tf-desc">
  <title id="tf-title">TeamFlow Change Impact Analysis: Verified Source Dependencies vs. AI Predictions (Report IMP-001)</title>
  <desc id="tf-desc">Warm ivory diagram of TeamFlow Report IMP-001 showing the 2-hop ts-morph dependency chain from taskAssignmentService.ts to taskRoutes.ts (E-001), bulkTaskService.ts (E-002), and projectOperations.ts (E-003) alongside active rule DEC-001, clearly separated from AI predictions saved via record_impact_assessment.</desc>
  <defs>
    <pattern id="bp-grid-tf" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#EBE5D8" stroke-width="1"/>
    </pattern>
    <style>
      .canvas { fill: #FBF9F4; stroke: #DFD8C8; stroke-width: 2; }
      .panel-v { fill: #FFFFFF; stroke: #D0C8B8; stroke-width: 1.75; }
      .panel-p { fill: #FEF7EC; stroke: #C89236; stroke-width: 1.75; stroke-dasharray: 6 4; }
      .b-start { fill: #DBEAFE; stroke: #5B8AC6; stroke-width: 1.75; }
      .b-dep { fill: #DCFCE7; stroke: #5E9E78; stroke-width: 1.75; }
      .b-dec { fill: #EDE9FE; stroke: #8B7EC8; stroke-width: 1.75; }
      .b-pred { fill: #F9E3D8; stroke: #C9866B; stroke-width: 1.75; }
      .t-head { fill: #0F2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #1E293B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 500; }
      .t-mono { fill: #1E3A5F; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .edge { fill: none; stroke: #1E3A5F; stroke-width: 2.25; stroke-linecap: round; }
      .edge-dec { fill: none; stroke: #6D5CAE; stroke-width: 2.25; stroke-linecap: round; }
    </style>
    <marker id="mt-n" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1E3A5F"/>
    </marker>
    <marker id="mt-d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#6D5CAE"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1116" height="356" rx="16" class="canvas"/>
  <rect x="4" y="4" width="1112" height="352" rx="14" fill="url(#bp-grid-tf)"/>

  <!-- ========================================================= -->
  <!-- LEFT PANEL: VERIFIED REPOSITORY & DECISION EVIDENCE       -->
  <!-- ========================================================= -->
  <g transform="translate(28, 26)">
    <rect x="0" y="0" width="706" height="308" rx="12" class="panel-v"/>
    <text x="22" y="28" class="t-mono" font-size="11" fill="#276749" letter-spacing="0.6">VERIFIED SOURCE &amp; DECISION EVIDENCE (analyze_change · REPORT IMP-001)</text>

    <!-- Starting File (0-Hop) -->
    <g transform="translate(22, 62)">
      <rect x="0" y="0" width="212" height="74" rx="9" class="b-start"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#2D5A88">STARTING CANDIDATE (0-HOP)</text>
      <text x="14" y="45" class="t-mono" font-size="11.5">taskAssignmentService.ts</text>
      <text x="14" y="62" class="t-body" font-size="10.5">Chosen by Codex; verified on disk</text>
    </g>

    <!-- Linked Decision DEC-001 -->
    <g transform="translate(22, 184)">
      <rect x="0" y="0" width="212" height="84" rx="9" class="b-dec"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#5B4B9E">APPROVED RULE · DEC-001</text>
      <text x="14" y="44" class="t-head" font-size="13">Manager-Only Ownership</text>
      <text x="14" y="62" class="t-body" font-size="11.5">Only project managers can</text>
      <text x="14" y="76" class="t-body" font-size="11.5">authorize task reassignment</text>
    </g>

    <line x1="128" y1="184" x2="128" y2="141" class="edge-dec" marker-end="url(#mt-d)"/>

    <!-- 1-Hop Direct Dependent 1: taskRoutes.ts -->
    <g transform="translate(282, 52)">
      <rect x="0" y="0" width="184" height="70" rx="9" class="b-dep"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#276749">1-HOP DIRECT · E-001</text>
      <text x="14" y="44" class="t-mono" font-size="12">taskRoutes.ts</text>
      <text x="14" y="60" class="t-body" font-size="11">Imports assignment service</text>
    </g>

    <!-- 1-Hop Direct Dependent 2: bulkTaskService.ts -->
    <g transform="translate(282, 152)">
      <rect x="0" y="0" width="184" height="70" rx="9" class="b-dep"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#276749">1-HOP DIRECT · E-002</text>
      <text x="14" y="44" class="t-mono" font-size="12">bulkTaskService.ts</text>
      <text x="14" y="60" class="t-body" font-size="11">Imports assignment logic</text>
    </g>

    <!-- 2-Hop Indirect Dependent: projectOperations.ts -->
    <g transform="translate(502, 152)">
      <rect x="0" y="0" width="182" height="70" rx="9" class="b-dep"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#276749">2-HOP INDIRECT · E-003</text>
      <text x="14" y="44" class="t-mono" font-size="11.5">projectOperations.ts</text>
      <text x="14" y="60" class="t-body" font-size="11">Imports bulkTaskService.ts</text>
    </g>

    <!-- Verified AST Edges -->
    <path d="M 234 87 L 256 87 L 277 87" class="edge" marker-end="url(#mt-n)"/>
    <path d="M 234 112 L 256 112 L 256 187 L 277 187" class="edge" marker-end="url(#mt-n)"/>
    <line x1="466" y1="187" x2="497" y2="187" class="edge" marker-end="url(#mt-n)"/>

    <!-- Honest Boundary Caption -->
    <rect x="282" y="242" width="402" height="44" rx="8" fill="#FBF9F4" stroke="#DFD8C8"/>
    <text x="296" y="261" class="t-head" font-size="11.5">Honest analysis scope (CI-03):</text>
    <text x="296" y="277" class="t-body" font-size="10.5">A verified dependency edge does not guarantee a file edit or breakage.</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: SEPARATELY LABELLED AI PREDICTIONS           -->
  <!-- ========================================================= -->
  <g transform="translate(754, 26)">
    <rect x="0" y="0" width="338" height="308" rx="12" class="panel-p"/>
    <text x="20" y="28" class="t-mono" font-size="11" fill="#8C4A32" letter-spacing="0.5">AI PREDICTIONS (record_impact_assessment)</text>
    <text x="20" y="46" class="t-body" font-size="11.5">Stored separately; never overwrites AST edges</text>

    <!-- Prediction 1 -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="298" height="104" rx="9" class="b-pred"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#8C4A32">AI PREDICTION · CONFLICT WARNING</text>
      <text x="14" y="44" class="t-head" font-size="13.5">Potential Conflict with DEC-001</text>
      <text x="14" y="64" class="t-body" font-size="11.5">Fully automatic reassignment changes</text>
      <text x="14" y="81" class="t-body" font-size="11.5">ownership without manager approval.</text>
    </g>

    <!-- Prediction 2 -->
    <g transform="translate(20, 182)">
      <rect x="0" y="0" width="298" height="104" rx="9" class="b-pred"/>
      <text x="14" y="23" class="t-mono" font-size="10" fill="#8C4A32">AI PREDICTION · WORKFLOW HYPOTHESIS</text>
      <text x="14" y="44" class="t-head" font-size="13.5">Leave-Status Interface Needed</text>
      <text x="14" y="64" class="t-body" font-size="11.5">Employees may need an interface to</text>
      <text x="14" y="81" class="t-body" font-size="11.5">report unavailability for reassignment.</text>
    </g>
  </g>
</svg>
