<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="1000" height="1080" role="img" aria-labelledby="t-end-to-end-workflow d-end-to-end-workflow">
<title id="t-end-to-end-workflow">Workflow, part 1 — Setup, Retrieve and Analyze</title>
<desc id="d-end-to-end-workflow">Stage 01: register the project and bind its repository, connect the coding agent through MCP and discover the seven tools, record human-approved baseline decisions if none exist, then retrieve approved context with get_decisions. Stage 02: the developer requests a change, the agent selects reliable starting files or symbols (or asks for more context), analyze_change traces real dependencies and matches approved decisions, the impact report is persisted, the agent interprets it and optionally records AI predictions separately before continuing to Stage 03.</desc>
