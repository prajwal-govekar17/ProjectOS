<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="100%" height="100%" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">ProjectOS End-to-End 18-Step TeamFlow Workflow</title>
  <desc id="wf-desc">Four-phase end-to-end developer and agent workflow illustrating the 18-step TeamFlow journey across Phase 01 Setup and Retrieve, Phase 02 Analyze Impact, Phase 03 Human Review and Decision Governance (comparing P0 Dashboard Review with P1 MCP Elicitation), and Phase 04 Implementation, Git Provenance, and Cross-Session Reuse.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .lane-1 { fill: #0C1322; stroke: #6366F1; stroke-width: 1.5; }
      .lane-2 { fill: #0C1322; stroke: #F59E0B; stroke-width: 1.5; }
      .lane-3 { fill: #0C1322; stroke: #10B981; stroke-width: 1.5; }
      .lane-4 { fill: #0C1322; stroke: #38BDF8; stroke-width: 1.5; }
      .step { fill: #111A2E; stroke: #263554; stroke-width: 1.25; }
      .step-gate { fill: #0B2625; stroke: #10B981; stroke-width: 1.75; }
      .step-p1 { fill: #151936; stroke: #818CF8; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .t-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .w-flow { fill: none; stroke: #64748B; stroke-width: 1.75; }
      .w-ok { fill: none; stroke: #10B981; stroke-width: 2; }
    </style>
    <marker id="arr-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1160" height="470" rx="14" class="bg"/>

  <!-- PHASE 01: SETUP & RETRIEVE (STEPS 1-4) -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="258" height="426" rx="10" class="lane-1"/>
    <rect x="0" y="0" width="258" height="36" rx="10" fill="#1E1B4B"/>
    <text x="14" y="23" fill="#A5B4FC" class="t-mono" font-size="10.5" font-weight="700">01 • SETUP &amp; RETRIEVE (1–4)</text>

    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#818CF8" class="t-mono" font-size="9" font-weight="700">STEPS 1–2 • BINDING &amp; DISCOVERY</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Register TeamFlow &amp; Connect Codex</text>
      <text x="12" y="55" class="t-muted" font-size="10">• Bind project_id: "teamflow" to repo</text>
      <text x="12" y="70" class="t-muted" font-size="10">• Local ts-morph initial source scan</text>
      <text x="12" y="85" fill="#A5B4FC" class="t-mono" font-size="9.5">MCP: tools/list (discover 7 tools)</text>
    </g>

    <line x1="129" y1="154" x2="129" y2="176" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 180)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#818CF8" class="t-mono" font-size="9" font-weight="700">STEP 3 • SEED PROJECT BRAIN</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Record Approved Architecture</text>
      <text x="12" y="55" class="t-muted" font-size="10">• DEC-001: Manager-only task ownership</text>
      <text x="12" y="70" class="t-muted" font-size="10">• DEC-002: Activity log audit trail</text>
      <text x="12" y="85" class="t-muted" font-size="10">• DEC-003: Post-save notifications</text>
    </g>

    <line x1="129" y1="284" x2="129" y2="306" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 310)">
      <rect x="0" y="0" width="230" height="100" rx="8" class="step"/>
      <text x="12" y="19" fill="#818CF8" class="t-mono" font-size="9" font-weight="700">STEP 4 • SESSION START</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Retrieve Active Decisions</text>
      <text x="12" y="55" class="t-muted" font-size="10">Codex recovers DEC-001..003 without</text>
      <text x="12" y="70" class="t-muted" font-size="10">needing prior chat transcripts.</text>
      <text x="12" y="86" fill="#A5B4FC" class="t-mono" font-size="9.5">MCP: get_decisions(teamflow)</text>
    </g>
  </g>

  <path d="M 280 360 L 300 360 L 300 100 L 306 100" class="w-flow" marker-end="url(#arr-s)"/>

  <!-- PHASE 02: ANALYZE IMPACT (STEPS 5-8) -->
  <g transform="translate(308, 22)">
    <rect x="0" y="0" width="258" height="426" rx="10" class="lane-2"/>
    <rect x="0" y="0" width="258" height="36" rx="10" fill="#451A03"/>
    <text x="14" y="23" fill="#FCD34D" class="t-mono" font-size="10.5" font-weight="700">02 • ANALYZE IMPACT (5–8)</text>

    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#FBBF24" class="t-mono" font-size="9" font-weight="700">STEPS 5–6 • FEATURE REQUEST</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Identify Candidate Starting Code</text>
      <text x="12" y="55" class="t-muted" font-size="10">Rahul asks for auto-reassignment on</text>
      <text x="12" y="70" class="t-muted" font-size="10">leave. Codex selects starting file:</text>
      <text x="12" y="86" fill="#FCD34D" class="t-mono" font-size="9.5">MCP: analyze_change(taskAssignment)</text>
    </g>

    <line x1="129" y1="154" x2="129" y2="176" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 180)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#FBBF24" class="t-mono" font-size="9" font-weight="700">STEP 7 • DETERMINISTIC AST SCAN</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Trace 2-Hop Dependencies</text>
      <text x="12" y="55" class="t-muted" font-size="10">• 1-hop: taskRoutes, bulkTaskService</text>
      <text x="12" y="70" class="t-muted" font-size="10">• 2-hop: projectOperations (E-001..003)</text>
      <text x="12" y="85" class="t-muted" font-size="10">• Matches active rule DEC-001</text>
    </g>

    <line x1="129" y1="284" x2="129" y2="306" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 310)">
      <rect x="0" y="0" width="230" height="100" rx="8" class="step"/>
      <text x="12" y="19" fill="#FBBF24" class="t-mono" font-size="9" font-weight="700">STEP 8 • PERSIST AI ASSESSMENT</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Separate Facts vs. Predictions</text>
      <text x="12" y="55" class="t-muted" font-size="10">Report IMP-001 saved; Codex records</text>
      <text x="12" y="70" class="t-muted" font-size="10">DEC-001 conflict as AI prediction.</text>
      <text x="12" y="86" fill="#FCD34D" class="t-mono" font-size="9.5">MCP: record_impact_assessment</text>
    </g>
  </g>

  <path d="M 566 360 L 586 360 L 586 100 L 592 100" class="w-flow" marker-end="url(#arr-s)"/>

  <!-- PHASE 03: DECIDE & APPROVE (STEPS 9-12) -->
  <g transform="translate(594, 22)">
    <rect x="0" y="0" width="258" height="426" rx="10" class="lane-3"/>
    <rect x="0" y="0" width="258" height="36" rx="10" fill="#064E3B"/>
    <text x="14" y="23" fill="#6EE7B7" class="t-mono" font-size="10.5" font-weight="700">03 • HUMAN APPROVAL (9–12)</text>

    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#34D399" class="t-mono" font-size="9" font-weight="700">STEPS 9–10 • REVISE &amp; PROPOSE</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Submit Pending Proposal DEC-004</text>
      <text x="12" y="55" class="t-muted" font-size="10">Rahul revises plan to suggest options</text>
      <text x="12" y="70" class="t-muted" font-size="10">for manager approval (IMP-002).</text>
      <text x="12" y="86" fill="#6EE7B7" class="t-mono" font-size="9.5">MCP: propose_decision → pending</text>
    </g>

    <line x1="129" y1="154" x2="129" y2="176" class="w-flow" marker-end="url(#arr-s)"/>

    <!-- P0 Primary Dashboard Approval + Manual Resume -->
    <g transform="translate(14, 180)">
      <rect x="0" y="0" width="230" height="122" rx="8" class="step-gate"/>
      <text x="12" y="19" fill="#6EE7B7" class="t-mono" font-size="9" font-weight="700">STEPS 11–12 • P0 PRIMARY PATH</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Dashboard Review &amp; Manual Resume</text>
      <text x="12" y="55" class="t-muted" font-size="10">• Codex stops (no continuous polling)</text>
      <text x="12" y="70" class="t-muted" font-size="10">• Rahul approves DEC-004 in dashboard</text>
      <text x="12" y="85" class="t-muted" font-size="10">• Resumed agent checks status once:</text>
      <text x="12" y="104" fill="#34D399" class="t-mono" font-size="9.5">MCP: get_decision_status(DEC-004)</text>
    </g>

    <!-- P1 Later Phase Elicitation -->
    <g transform="translate(14, 316)">
      <rect x="0" y="0" width="230" height="94" rx="8" class="step-p1"/>
      <text x="12" y="19" fill="#A5B4FC" class="t-mono" font-size="9" font-weight="700">P1 LATER PHASE • IN-CLIENT REVIEW</text>
      <text x="12" y="37" class="t-main" font-size="12" font-weight="700">Trusted MCP Elicitation</text>
      <text x="12" y="54" class="t-muted" font-size="10">Server requests human input via</text>
      <text x="12" y="68" class="t-muted" font-size="10">elicitation/create; fails closed to</text>
      <text x="12" y="82" class="t-muted" font-size="10">dashboard if untrusted or deferred.</text>
    </g>
  </g>

  <path d="M 838 240 L 866 240 L 866 100 L 876 100" class="w-ok" marker-end="url(#arr-g)"/>

  <!-- PHASE 04: RECORD & REUSE (STEPS 13-18) -->
  <g transform="translate(880, 22)">
    <rect x="0" y="0" width="258" height="426" rx="10" class="lane-4"/>
    <rect x="0" y="0" width="258" height="36" rx="10" fill="#0C4A6E"/>
    <text x="14" y="23" fill="#7DD3FC" class="t-mono" font-size="10.5" font-weight="700">04 • RECORD &amp; REUSE (13–18)</text>

    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#38BDF8" class="t-mono" font-size="9" font-weight="700">STEPS 13–15 • IMPLEMENT &amp; COMMIT</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Normal IDE Edits &amp; Git Commit</text>
      <text x="12" y="55" class="t-muted" font-size="10">• Codex implements approved plan</text>
      <text x="12" y="70" class="t-muted" font-size="10">• Rahul reviews, tests &amp; commits</text>
      <text x="12" y="86" fill="#7DD3FC" class="t-mono" font-size="9.5">Git SHA: a7c92f1 (normal Git)</text>
    </g>

    <line x1="129" y1="154" x2="129" y2="176" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 180)">
      <rect x="0" y="0" width="230" height="104" rx="8" class="step"/>
      <text x="12" y="19" fill="#38BDF8" class="t-mono" font-size="9" font-weight="700">STEPS 16–17 • GIT PROVENANCE</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Bind Commit to Approved DEC-004</text>
      <text x="12" y="55" class="t-muted" font-size="10">Git CLI verifies SHA &amp; changed files</text>
      <text x="12" y="70" class="t-muted" font-size="10">(taskAssignment, managerApproval).</text>
      <text x="12" y="86" fill="#7DD3FC" class="t-mono" font-size="9.5">MCP: link_commit_to_decision</text>
    </g>

    <line x1="129" y1="284" x2="129" y2="306" class="w-flow" marker-end="url(#arr-s)"/>

    <g transform="translate(14, 310)">
      <rect x="0" y="0" width="230" height="100" rx="8" class="step"/>
      <text x="12" y="19" fill="#38BDF8" class="t-mono" font-size="9" font-weight="700">STEP 18 • CROSS-SESSION REUSE</text>
      <text x="12" y="38" class="t-main" font-size="12.5" font-weight="700">Ananya Queries Why Rule Exists</text>
      <text x="12" y="55" class="t-muted" font-size="10">Fresh session retrieves DEC-004</text>
      <text x="12" y="70" class="t-muted" font-size="10">rationale &amp; commit a7c92f1 evidence.</text>
      <text x="12" y="86" fill="#7DD3FC" class="t-mono" font-size="9.5">MCP: get_git_traceability</text>
    </g>
  </g>

  <rect x="1" y="1" width="1158" height="468" rx="13" class="frame"/>
</svg>
