<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="100%" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">ProjectOS Four-Phase Development Workflow (The TeamFlow Story)</title>
  <desc id="wf-desc">Clean four-phase workflow diagram tracing Rahul and Ananya's TeamFlow journey: 01 Retrieve Context, 02 Analyze Impact, 03 Approve Decision, and 04 Link Commit and Reuse.</desc>
  <defs>
    <style>
      .canvas { fill: #FAF8F5; stroke: #E7E5E4; stroke-width: 2; }
      .card { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.75; }
      .num-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.25; }
      .num-amber { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1.25; }
      .num-green { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1.25; }
      .num-slate { fill: #F4F4F5; stroke: #D4D4D8; stroke-width: 1.25; }
      .t-head { fill: #18181B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
      .t-body { fill: #52525B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 400; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
      .line { fill: none; stroke: #52525B; stroke-width: 1.75; }
      .loop { fill: none; stroke: #2563EB; stroke-width: 1.75; stroke-dasharray: 5 4; }
    </style>
    <marker id="ar-w" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#52525B"/>
    </marker>
    <marker id="ar-l" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="306" rx="16" class="canvas"/>

  <!-- Phase 1: Retrieve -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="212" height="190" rx="12" class="card"/>
    <rect x="18" y="18" width="96" height="24" rx="6" class="num-blue"/>
    <text x="66" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#1D4ED8">01 · RETRIEVE</text>

    <text x="18" y="70" class="t-head" font-size="16">Load Active Rules</text>
    <text x="18" y="95" class="t-body" font-size="12.5">Rahul starts Codex on</text>
    <text x="18" y="113" class="t-body" font-size="12.5">TeamFlow and recovers</text>
    <text x="18" y="131" class="t-body" font-size="12.5">rule <tspan class="t-mono" font-size="11.5">DEC-001</tspan>.</text>
    <text x="18" y="166" class="t-mono" font-size="11" fill="#2563EB">get_decisions</text>
  </g>

  <line x1="244" y1="131" x2="269" y2="131" class="line" marker-end="url(#ar-w)"/>

  <!-- Phase 2: Analyze -->
  <g transform="translate(274, 36)">
    <rect x="0" y="0" width="212" height="190" rx="12" class="card"/>
    <rect x="18" y="18" width="96" height="24" rx="6" class="num-amber"/>
    <text x="66" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#B45309">02 · ANALYZE</text>

    <text x="18" y="70" class="t-head" font-size="16">Inspect Impact</text>
    <text x="18" y="95" class="t-body" font-size="12.5">Traces 2-hop dependencies</text>
    <text x="18" y="113" class="t-body" font-size="12.5">and flags conflict with</text>
    <text x="18" y="131" class="t-body" font-size="12.5">manager-only rule.</text>
    <text x="18" y="166" class="t-mono" font-size="11" fill="#D97706">analyze_change</text>
  </g>

  <line x1="486" y1="131" x2="511" y2="131" class="line" marker-end="url(#ar-w)"/>

  <!-- Phase 3: Decide -->
  <g transform="translate(516, 36)">
    <rect x="0" y="0" width="212" height="190" rx="12" class="card"/>
    <rect x="18" y="18" width="96" height="24" rx="6" class="num-green"/>
    <text x="66" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#047857">03 · DECIDE</text>

    <text x="18" y="70" class="t-head" font-size="16">Approve Proposal</text>
    <text x="18" y="95" class="t-body" font-size="12.5">Rahul revises plan and</text>
    <text x="18" y="113" class="t-body" font-size="12.5">approves <tspan class="t-mono" font-size="11.5">DEC-004</tspan> in</text>
    <text x="18" y="131" class="t-body" font-size="12.5">the dashboard.</text>
    <text x="18" y="166" class="t-mono" font-size="11" fill="#059669">propose_decision</text>
  </g>

  <line x1="728" y1="131" x2="753" y2="131" class="line" marker-end="url(#ar-w)"/>

  <!-- Phase 4: Record & Reuse -->
  <g transform="translate(758, 36)">
    <rect x="0" y="0" width="210" height="190" rx="12" class="card"/>
    <rect x="18" y="18" width="96" height="24" rx="6" class="num-slate"/>
    <text x="66" y="34" text-anchor="middle" class="t-mono" font-size="10.5" fill="#3F3F46">04 · RECORD</text>

    <text x="18" y="70" class="t-head" font-size="16">Link Git Commit</text>
    <text x="18" y="95" class="t-body" font-size="12.5">Links commit <tspan class="t-mono" font-size="11.5">a7c92f1</tspan></text>
    <text x="18" y="113" class="t-body" font-size="12.5">to <tspan class="t-mono" font-size="11.5">DEC-004</tspan> for Ananya's</text>
    <text x="18" y="131" class="t-body" font-size="12.5">next coding session.</text>
    <text x="18" y="166" class="t-mono" font-size="11" fill="#18181B">link_commit_to_decision</text>
  </g>

  <!-- Return Continuity Loop -->
  <path d="M 863 226 L 863 268 L 138 268 L 138 231" class="loop" marker-end="url(#ar-l)"/>
  <rect x="330" y="253" width="340" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.25"/>
  <text x="500" y="271" text-anchor="middle" class="t-mono" font-size="11" fill="#1D4ED8">
    Ananya recovers DEC-004 &amp; commit a7c92f1 in a fresh session
  </text>
</svg>
