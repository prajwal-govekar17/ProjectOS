<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t-workflow-record-reuse d-workflow-record-reuse">
<title id="t-workflow-record-reuse">Workflow, part 3 — Record and Reuse</title>
<desc id="d-workflow-record-reuse">Stage 04. The agent implements the reviewed approach, the developer reviews and tests it and creates a normal Git commit. If an approved decision applies, the commit is explicitly associated with it using link_commit_to_decision; Git CLI captures the full hash and changed paths, and the association with its provenance is stored. Future sessions retrieve the reasoning with get_git_traceability. A commit with no applicable decision stays unlinked, which is valid.</desc>
