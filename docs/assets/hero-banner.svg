<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ProjectOS — Architectural Decision Intelligence for AI-Assisted Software Engineering</title>
  <desc id="hero-desc">Hero banner illustrating how ProjectOS connects AI coding agents via Model Context Protocol (MCP) to a unified architectural decision engine spanning Project Brain, Change Impact Intelligence, and AI Git Timeline.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .grid-line { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.45; }
      .border-frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .card-bg { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
      .card-accent-purple { fill: #0F172A; stroke: #6366F1; stroke-width: 1.5; }
      .card-accent-amber { fill: #0F172A; stroke: #F59E0B; stroke-width: 1.5; }
      .card-accent-emerald { fill: #0F172A; stroke: #10B981; stroke-width: 1.5; }
      .card-accent-cyan { fill: #131C31; stroke: #38BDF8; stroke-width: 1.5; }
      .pill-bg { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .pill-purple { fill: #1E1B4B; stroke: #4F46E5; stroke-width: 1; }
      .pill-emerald { fill: #064E3B; stroke: #059669; stroke-width: 1; }
      .pill-amber { fill: #451A03; stroke: #D97706; stroke-width: 1; }
      .text-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .conn-line { fill: none; stroke: #334155; stroke-width: 1.75; stroke-dasharray: 4 4; }
      .conn-active { fill: none; stroke: #38BDF8; stroke-width: 2; }
      .conn-purple { fill: none; stroke: #818CF8; stroke-width: 1.75; }
      .conn-amber { fill: none; stroke: #FBBF24; stroke-width: 1.75; }
      .conn-emerald { fill: none; stroke: #34D399; stroke-width: 1.75; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #0B0F19; }
      }
    </style>

    <radialGradient id="glow-indigo" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="75%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" class="bg"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow-indigo)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow-cyan)"/>

  <!-- Subtle Technical Grid -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line"/>
    <line x1="0" y1="190" x2="1200" y2="190" class="grid-line"/>
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>
    <line x1="560" y1="0" x2="560" y2="380" class="grid-line"/>
    <line x1="860" y1="0" x2="860" y2="380" class="grid-line"/>
  </g>

  <!-- LEFT COLUMN: Brand & Core Value Proposition -->
  <g transform="translate(52, 54)">
    <!-- Protocol Badge -->
    <rect x="0" y="0" width="290" height="28" rx="14" class="pill-purple"/>
    <circle cx="16" cy="14" r="4" fill="#818CF8"/>
    <text x="28" y="18" class="text-mono" fill="#C7D2FE" font-size="11" font-weight="600" letter-spacing="0.8">MCP-NATIVE DECISION INTELLIGENCE</text>

    <!-- Product Mark + Title -->
    <g transform="translate(0, 48)">
      <rect x="0" y="2" width="46" height="46" rx="11" fill="#1E1B4B" stroke="#6366F1" stroke-width="2"/>
      <!-- Geometric architectural node icon -->
      <circle cx="15" cy="16" r="4" fill="#818CF8"/>
      <circle cx="31" cy="16" r="4" fill="#38BDF8"/>
      <circle cx="23" cy="32" r="4" fill="#34D399"/>
      <line x1="18" y1="16" x2="28" y2="16" stroke="#94A3B8" stroke-width="1.75"/>
      <line x1="16" y1="19" x2="21" y2="29" stroke="#94A3B8" stroke-width="1.75"/>
      <line x1="30" y1="19" x2="25" y2="29" stroke="#94A3B8" stroke-width="1.75"/>

      <text x="62" y="38" class="text-main" font-size="44" font-weight="800" letter-spacing="-1">Project<tspan fill="#818CF8">OS</tspan></text>
    </g>

    <!-- Tagline -->
    <text x="0" y="132" class="text-main" font-size="19" font-weight="600">
      Architectural memory, evidence-backed impact
    </text>
    <text x="0" y="158" class="text-main" font-size="19" font-weight="600">
      analysis, and Git provenance for AI coding agents.
    </text>

    <!-- Sub-description -->
    <text x="0" y="192" class="text-muted" font-size="13.5">
      Preserve human-approved decisions across sessions, inspect source-grounded
    </text>
    <text x="0" y="212" class="text-muted" font-size="13.5">
      dependencies before editing, and trace real commits back to architectural intent.
    </text>

    <!-- Three Pillar Pills -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="136" height="30" rx="6" class="pill-bg"/>
      <circle cx="14" cy="15" r="4" fill="#818CF8"/>
      <text x="26" y="19" class="text-main text-mono" font-size="11.5" font-weight="600">Project Brain</text>

      <rect x="148" y="0" width="144" height="30" rx="6" class="pill-bg"/>
      <circle cx="162" cy="15" r="4" fill="#FBBF24"/>
      <text x="174" y="19" class="text-main text-mono" font-size="11.5" font-weight="600">Change Impact</text>

      <rect x="304" y="0" width="148" height="30" rx="6" class="pill-bg"/>
      <circle cx="318" cy="15" r="4" fill="#34D399"/>
      <text x="330" y="19" class="text-main text-mono" font-size="11.5" font-weight="600">AI Git Timeline</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Architectural Schematic Illustration -->
  <g transform="translate(570, 32)">
    <!-- Outer Schematic Container -->
    <rect x="0" y="0" width="590" height="316" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header bar inside schematic -->
    <line x1="0" y1="34" x2="590" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#475569"/>
    <circle cx="32" cy="17" r="4" fill="#475569"/>
    <circle cx="46" cy="17" r="4" fill="#475569"/>
    <text x="66" y="21" class="text-dim text-mono" font-size="10.5" font-weight="600">DECISION CONTINUITY &amp; GOVERNANCE PIPELINE</text>
    <text x="455" y="21" class="text-mono" fill="#38BDF8" font-size="10.5" font-weight="600">HUMAN-AUTHORITATIVE</text>

    <!-- Node 1: AI Coding Clients (Left of Schematic) -->
    <g transform="translate(22, 60)">
      <rect x="0" y="0" width="142" height="112" rx="8" class="card-bg"/>
      <text x="14" y="22" class="text-dim text-mono" font-size="9.5" font-weight="700">AI CODING AGENTS</text>
      <rect x="12" y="32" width="118" height="20" rx="4" fill="#1E293B"/>
      <text x="20" y="46" class="text-main text-mono" font-size="10.5">Claude Code</text>
      <rect x="12" y="57" width="118" height="20" rx="4" fill="#1E293B"/>
      <text x="20" y="71" class="text-main text-mono" font-size="10.5">Codex / Cursor</text>
      <rect x="12" y="82" width="118" height="20" rx="4" fill="#1E293B"/>
      <text x="20" y="96" class="text-main text-mono" font-size="10.5">Antigravity</text>
    </g>

    <!-- Node 2: Local Repository & Engines (Bottom-Left of Schematic) -->
    <g transform="translate(22, 192)">
      <rect x="0" y="0" width="142" height="102" rx="8" class="card-bg"/>
      <text x="14" y="22" class="text-dim text-mono" font-size="9.5" font-weight="700">LOCAL REPOSITORY</text>
      <text x="14" y="44" class="text-main text-mono" font-size="11" font-weight="600">ts-morph AST</text>
      <text x="14" y="59" class="text-muted" font-size="10">Verified JS/TS graph</text>
      <line x1="14" y1="68" x2="128" y2="68" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="84" class="text-main text-mono" font-size="11" font-weight="600">Git CLI</text>
      <text x="64" y="84" class="text-muted" font-size="10">Commits &amp; diffs</text>
    </g>

    <!-- Node 3: ProjectOS MCP Hub (Center of Schematic) -->
    <g transform="translate(206, 108)">
      <rect x="0" y="0" width="136" height="118" rx="10" class="card-accent-cyan"/>
      <rect x="24" y="-10" width="88" height="20" rx="10" fill="#0284C7"/>
      <text x="68" y="4" text-anchor="middle" class="text-main text-mono" font-size="9.5" font-weight="700">MCP SERVER</text>
      <text x="68" y="34" text-anchor="middle" class="text-main" font-size="13" font-weight="700">ProjectOS Hub</text>
      <text x="68" y="52" text-anchor="middle" class="text-muted text-mono" font-size="10">TypeScript SDK</text>
      <line x1="16" y1="64" x2="120" y2="64" stroke="#1E293B" stroke-width="1"/>
      <text x="68" y="82" text-anchor="middle" fill="#38BDF8" class="text-mono" font-size="10">Context Retrieval</text>
      <text x="68" y="97" text-anchor="middle" fill="#38BDF8" class="text-mono" font-size="10">Impact Evidence</text>
      <text x="68" y="112" text-anchor="middle" fill="#38BDF8" class="text-mono" font-size="10">Commit Linking</text>
    </g>

    <!-- Connectors: Left -> Center -->
    <path d="M 164 116 L 185 116 L 185 148 L 202 148" class="conn-active" marker-end="url(#arrow-cyan)" marker-start="url(#arrow-cyan)"/>
    <path d="M 164 242 L 185 242 L 185 188 L 202 188" class="conn-active" marker-end="url(#arrow-cyan)"/>

    <!-- Right Stack: 3 Core Capabilities Sharing Decision ID -->
    <!-- Pillar 1: Project Brain -->
    <g transform="translate(386, 52)">
      <rect x="0" y="0" width="184" height="74" rx="8" class="card-accent-purple"/>
      <rect x="12" y="10" width="60" height="18" rx="4" class="pill-purple"/>
      <text x="42" y="22" text-anchor="middle" fill="#A5B4FC" class="text-mono" font-size="9.5" font-weight="700">DEC-014</text>
      <text x="80" y="23" fill="#34D399" class="text-mono" font-size="9.5" font-weight="700">● APPROVED</text>
      <text x="12" y="44" class="text-main" font-size="12.5" font-weight="700">Project Brain</text>
      <text x="12" y="61" class="text-muted" font-size="10.5">Human-governed decisions</text>
    </g>

    <!-- Pillar 2: Change Impact Intelligence -->
    <g transform="translate(386, 138)">
      <rect x="0" y="0" width="184" height="74" rx="8" class="card-accent-amber"/>
      <rect x="12" y="10" width="76" height="18" rx="4" class="pill-amber"/>
      <text x="50" y="22" text-anchor="middle" fill="#FCD34D" class="text-mono" font-size="9.5" font-weight="700">PRE-CHANGE</text>
      <text x="96" y="23" fill="#FBBF24" class="text-mono" font-size="9.5" font-weight="600">Verified vs AI</text>
      <text x="12" y="44" class="text-main" font-size="12.5" font-weight="700">Change Impact</text>
      <text x="12" y="61" class="text-muted" font-size="10.5">Dependency &amp; conflict graph</text>
    </g>

    <!-- Pillar 3: AI Git Timeline -->
    <g transform="translate(386, 224)">
      <rect x="0" y="0" width="184" height="74" rx="8" class="card-accent-emerald"/>
      <rect x="12" y="10" width="108" height="18" rx="4" class="pill-emerald"/>
      <text x="66" y="22" text-anchor="middle" fill="#6EE7B7" class="text-mono" font-size="9.5" font-weight="700">a82f1c → DEC-015</text>
      <text x="12" y="44" class="text-main" font-size="12.5" font-weight="700">AI Git Timeline</text>
      <text x="12" y="61" class="text-muted" font-size="10.5">Commit-to-rationale links</text>
    </g>

    <!-- Connectors: Center -> Right Pillars -->
    <path d="M 342 142 L 364 142 L 364 89 L 382 89" class="conn-purple" marker-end="url(#arrow-purple)"/>
    <path d="M 342 167 L 382 167" class="conn-amber" marker-end="url(#arrow-amber)"/>
    <path d="M 342 192 L 364 192 L 364 261 L 382 261" class="conn-emerald" marker-end="url(#arrow-emerald)"/>
  </g>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" class="border-frame"/>
</svg>
