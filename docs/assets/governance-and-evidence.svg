<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" height="100%" role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">ProjectOS Governance Boundary and Evidence Classification</title>
  <desc id="ev-desc">Infographic contrasting deterministic Verified Evidence (Repository AST/Git Facts and Project Brain Decision Records) against Unconfirmed Assessment requiring developer review (AI Predictions and Static Analysis Blind Spots), paired with the Human Governance Gate.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .panel-verified { fill: #0B191E; stroke: #10B981; stroke-width: 1.5; }
      .panel-speculative { fill: #191510; stroke: #F59E0B; stroke-width: 1.5; }
      .subcard { fill: #0F172A; stroke: #1E293B; stroke-width: 1.25; }
      .tag-emerald { fill: #064E3B; stroke: #059669; stroke-width: 1; }
      .tag-purple { fill: #1E1B4B; stroke: #4F46E5; stroke-width: 1; }
      .tag-amber { fill: #451A03; stroke: #D97706; stroke-width: 1; }
      .tag-slate { fill: #1E293B; stroke: #475569; stroke-width: 1; }
      .text-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1120" height="340" rx="14" class="bg"/>

  <!-- Header -->
  <text x="32" y="34" class="text-main" font-size="16" font-weight="700">Evidence Taxonomy: Fact vs. Hypothesis in Change Impact Intelligence</text>
  <text x="32" y="54" class="text-muted" font-size="12">ProjectOS never conflates deterministic source/repository evidence with generative LLM speculation.</text>

  <!-- LEFT PANEL: DETERMINISTIC & AUTHORITATIVE EVIDENCE -->
  <g transform="translate(28, 72)">
    <rect x="0" y="0" width="518" height="244" rx="10" class="panel-verified"/>
    <text x="20" y="28" fill="#34D399" class="text-mono" font-size="11.5" font-weight="700">✓ VERIFIED EVIDENCE (DETERMINISTIC &amp; RECORDED)</text>

    <!-- Tier 1: Verified Repository Relationship -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="482" height="84" rx="8" class="subcard"/>
      <rect x="14" y="12" width="128" height="18" rx="4" class="tag-emerald"/>
      <text x="78" y="24" text-anchor="middle" fill="#6EE7B7" class="text-mono" font-size="9.5" font-weight="700">TIER 1 • SOURCE / GIT</text>
      <text x="154" y="25" class="text-main" font-size="13.5" font-weight="700">Verified Repository Relationship</text>
      <text x="14" y="48" class="text-muted" font-size="11.5">Extracted deterministically by ts-morph AST analysis or Git CLI inspection.</text>
      <text x="14" y="68" fill="#94A3B8" class="text-mono" font-size="10.5">Example: src/orders/repository.ts directly imports src/db/client.ts</text>
    </g>

    <!-- Tier 2: Recorded Project Relationship -->
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="482" height="84" rx="8" class="subcard"/>
      <rect x="14" y="12" width="128" height="18" rx="4" class="tag-purple"/>
      <text x="78" y="24" text-anchor="middle" fill="#A5B4FC" class="text-mono" font-size="9.5" font-weight="700">TIER 2 • PROJECT BRAIN</text>
      <text x="154" y="25" class="text-main" font-size="13.5" font-weight="700">Recorded Project Relationship</text>
      <text x="14" y="48" class="text-muted" font-size="11.5">Explicitly stored in human-approved Project Brain architectural decision records.</text>
      <text x="14" y="68" fill="#94A3B8" class="text-mono" font-size="10.5">Example: Approved decision DEC-014 governs persistence module scope</text>
    </g>
  </g>

  <!-- RIGHT PANEL: SPECULATIVE & UNCONFIRMED (REQUIRES HUMAN JUDGMENT) -->
  <g transform="translate(574, 72)">
    <rect x="0" y="0" width="518" height="244" rx="10" class="panel-speculative"/>
    <text x="20" y="28" fill="#FBBF24" class="text-mono" font-size="11.5" font-weight="700">⚠ REQUIRES HUMAN JUDGMENT (HYPOTHESIS &amp; BOUNDARIES)</text>

    <!-- Tier 3: AI Prediction -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="482" height="84" rx="8" class="subcard"/>
      <rect x="14" y="12" width="136" height="18" rx="4" class="tag-amber"/>
      <text x="82" y="24" text-anchor="middle" fill="#FCD34D" class="text-mono" font-size="9.5" font-weight="700">TIER 3 • LLM REASONING</text>
      <text x="162" y="25" class="text-main" font-size="13.5" font-weight="700">AI Prediction (Unconfirmed Hypothesis)</text>
      <text x="14" y="48" class="text-muted" font-size="11.5">Plausible indirect effect inferred by the connected agent's LLM; not proven by AST.</text>
      <text x="14" y="68" fill="#94A3B8" class="text-mono" font-size="10.5">Example: Auth session store might rely on SQL transactional rollback semantics</text>
    </g>

    <!-- Tier 4: Unknown / Needs Review -->
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="482" height="84" rx="8" class="subcard"/>
      <rect x="14" y="12" width="136" height="18" rx="4" class="tag-slate"/>
      <text x="82" y="24" text-anchor="middle" fill="#CBD5E1" class="text-mono" font-size="9.5" font-weight="700">TIER 4 • STATIC LIMIT</text>
      <text x="162" y="25" class="text-main" font-size="13.5" font-weight="700">Unknown / Needs Developer Review</text>
      <text x="14" y="48" class="text-muted" font-size="11.5">Dynamic runtime wiring, external services, or non-JS/TS boundaries outside AST reach.</text>
      <text x="14" y="68" fill="#94A3B8" class="text-mono" font-size="10.5">Example: External webhook consumers or dynamic runtime reflection calls</text>
    </g>
  </g>

  <rect x="1" y="1" width="1118" height="338" rx="13" class="frame"/>
</svg>
