<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" width="100%" height="100%" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">ProjectOS End-to-End Developer and Agent Workflow</title>
  <desc id="wf-desc">Four-phase horizontal workflow diagram showing Phase 01 Setup and Context Retrieval, Phase 02 Repository-Backed Impact Analysis, Phase 03 Human Governance and Approval Gate, and Phase 04 Implementation and Git Traceability.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .lane-p1 { fill: #0C1322; stroke: #6366F1; stroke-width: 1.5; }
      .lane-p2 { fill: #0C1322; stroke: #F59E0B; stroke-width: 1.5; }
      .lane-p3 { fill: #0C1322; stroke: #10B981; stroke-width: 1.5; }
      .lane-p4 { fill: #0C1322; stroke: #38BDF8; stroke-width: 1.5; }
      .step-box { fill: #111A2E; stroke: #263554; stroke-width: 1.25; }
      .gate-box { fill: #0B2625; stroke: #10B981; stroke-width: 1.75; }
      .reject-box { fill: #2A1215; stroke: #F43F5E; stroke-width: 1.25; }
      .text-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .flow-line { fill: none; stroke: #64748B; stroke-width: 1.75; }
      .approve-line { fill: none; stroke: #10B981; stroke-width: 2; }
      .reject-line { fill: none; stroke: #F43F5E; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
    <marker id="wf-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="wf-ok" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="wf-no" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F43F5E"/>
    </marker>
  </defs>

  <rect width="1160" height="440" rx="14" class="bg"/>

  <!-- PHASE 01: SETUP & RETRIEVE -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="256" height="392" rx="10" class="lane-p1"/>
    <rect x="0" y="0" width="256" height="38" rx="10" fill="#1E1B4B"/>
    <text x="16" y="24" fill="#A5B4FC" class="text-mono" font-size="11" font-weight="700">01 • CONTEXT RETRIEVAL</text>

    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="224" height="84" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#818CF8" class="text-mono" font-size="9.5" font-weight="700">STEP 1 • WORKSPACE LINK</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Connect Repo &amp; MCP</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Coding agent connects to local</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">ProjectOS MCP server &amp; codebase.</text>
    </g>

    <line x1="128" y1="140" x2="128" y2="164" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="224" height="88" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#818CF8" class="text-mono" font-size="9.5" font-weight="700">STEP 2 • CHANGE REQUEST</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Developer Prompts Agent</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">e.g. "Migrate order persistence</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">from PostgreSQL to MongoDB."</text>
    </g>

    <line x1="128" y1="256" x2="128" y2="280" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 284)">
      <rect x="0" y="0" width="224" height="90" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#818CF8" class="text-mono" font-size="9.5" font-weight="700">STEP 3 • PROJECT BRAIN QUERY</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Recover Approved Intent</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Agent retrieves DEC-014 (Postgres)</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">&amp; active architectural constraints.</text>
    </g>
  </g>

  <!-- Connector Phase 1 -> Phase 2 -->
  <path d="M 280 329 L 310 329 L 310 98 L 316 98" class="flow-line" marker-end="url(#wf-arr)"/>

  <!-- PHASE 02: ANALYZE IMPACT -->
  <g transform="translate(310, 24)">
    <rect x="0" y="0" width="256" height="392" rx="10" class="lane-p2"/>
    <rect x="0" y="0" width="256" height="38" rx="10" fill="#451A03"/>
    <text x="16" y="24" fill="#FCD34D" class="text-mono" font-size="11" font-weight="700">02 • IMPACT ANALYSIS</text>

    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="224" height="96" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#FBBF24" class="text-mono" font-size="9.5" font-weight="700">STEP 4 • LOCAL REPO SCAN</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">ts-morph &amp; Git Inspection</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Deterministic AST scan locates</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">src/db/client.ts, dependent</text>
      <text x="12" y="86" class="text-muted" font-size="10.5">repositories &amp; SQL migrations.</text>
    </g>

    <line x1="128" y1="152" x2="128" y2="176" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 180)">
      <rect x="0" y="0" width="224" height="96" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#FBBF24" class="text-mono" font-size="9.5" font-weight="700">STEP 5 • EVIDENCE TIERING</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Verified vs. AI Prediction</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Separates confirmed code/decision</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">facts from unconfirmed LLM</text>
      <text x="12" y="86" class="text-muted" font-size="10.5">hypotheses (e.g. session effects).</text>
    </g>

    <line x1="128" y1="276" x2="128" y2="296" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 300)">
      <rect x="0" y="0" width="224" height="74" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#FBBF24" class="text-mono" font-size="9.5" font-weight="700">STEP 6 • CONFLICT DETECTION</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Flag Decision Conflict</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Change contradicts active DEC-014.</text>
    </g>
  </g>

  <!-- Connector Phase 2 -> Phase 3 -->
  <path d="M 566 337 L 590 337 L 590 98 L 596 98" class="flow-line" marker-end="url(#wf-arr)"/>

  <!-- PHASE 03: HUMAN DECISION GOVERNANCE -->
  <g transform="translate(596, 24)">
    <rect x="0" y="0" width="256" height="392" rx="10" class="lane-p3"/>
    <rect x="0" y="0" width="256" height="38" rx="10" fill="#064E3B"/>
    <text x="16" y="24" fill="#6EE7B7" class="text-mono" font-size="11" font-weight="700">03 • HUMAN GOVERNANCE</text>

    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="224" height="82" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#34D399" class="text-mono" font-size="9.5" font-weight="700">STEP 7 • PENDING PROPOSAL</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Submit via MCP</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Agent submits DEC-015 proposal</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">(status: Proposed, non-active).</text>
    </g>

    <line x1="128" y1="138" x2="128" y2="160" class="flow-line" marker-end="url(#wf-arr)"/>

    <!-- Human Governance Gate -->
    <g transform="translate(16, 164)">
      <rect x="0" y="0" width="224" height="106" rx="8" class="gate-box"/>
      <text x="12" y="20" fill="#6EE7B7" class="text-mono" font-size="9.5" font-weight="700">STEP 8 • AUTHORIZED GATE</text>
      <text x="12" y="40" class="text-main" font-size="13.5" font-weight="700">Human Dashboard Review</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Developer inspects React Flow</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">Impact Graph &amp; approves/rejects.</text>
      <text x="12" y="92" fill="#34D399" class="text-mono" font-size="9.5" font-weight="700">✓ Approve → Supersedes DEC-014</text>
    </g>

    <!-- Reject Branch -->
    <line x1="128" y1="270" x2="128" y2="298" class="reject-line" marker-end="url(#wf-no)"/>
    <g transform="translate(16, 302)">
      <rect x="0" y="0" width="224" height="72" rx="8" class="reject-box"/>
      <text x="12" y="20" fill="#FDA4AF" class="text-mono" font-size="9.5" font-weight="700">✕ IF REJECTED</text>
      <text x="12" y="38" class="text-main" font-size="12" font-weight="700">Policy Unchanged</text>
      <text x="12" y="55" class="text-muted" font-size="10">DEC-014 stays active; revise plan.</text>
    </g>
  </g>

  <!-- Connector Phase 3 (Approved) -> Phase 4 -->
  <path d="M 836 217 L 866 217 L 866 98 L 878 98" class="approve-line" marker-end="url(#wf-ok)"/>

  <!-- PHASE 04: IMPLEMENT & RECORD -->
  <g transform="translate(880, 24)">
    <rect x="0" y="0" width="256" height="392" rx="10" class="lane-p4"/>
    <rect x="0" y="0" width="256" height="38" rx="10" fill="#0C4A6E"/>
    <text x="16" y="24" fill="#7DD3FC" class="text-mono" font-size="11" font-weight="700">04 • GIT PROVENANCE</text>

    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="224" height="84" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#38BDF8" class="text-mono" font-size="9.5" font-weight="700">STEP 9 • IMPLEMENTATION</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Edit &amp; Real Git Commit</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Agent edits code under normal IDE</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">permissions; dev commits a82f1c.</text>
    </g>

    <line x1="128" y1="140" x2="128" y2="164" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="224" height="88" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#38BDF8" class="text-mono" font-size="9.5" font-weight="700">STEP 10 • PROVENANCE LINK</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Link Commit to Decision</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">AI Git links commit a82f1c and</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">changed files to approved DEC-015.</text>
    </g>

    <line x1="128" y1="256" x2="128" y2="280" class="flow-line" marker-end="url(#wf-arr)"/>

    <g transform="translate(16, 284)">
      <rect x="0" y="0" width="224" height="90" rx="8" class="step-box"/>
      <text x="12" y="20" fill="#38BDF8" class="text-mono" font-size="9.5" font-weight="700">STEP 11 • FUTURE SESSIONS</text>
      <text x="12" y="40" class="text-main" font-size="13" font-weight="700">Cross-Agent Continuity</text>
      <text x="12" y="58" class="text-muted" font-size="10.5">Any compatible agent retrieves</text>
      <text x="12" y="72" class="text-muted" font-size="10.5">DEC-015 &amp; commit lineage via MCP.</text>
    </g>
  </g>

  <rect x="1" y="1" width="1158" height="438" rx="13" class="frame"/>
</svg>
