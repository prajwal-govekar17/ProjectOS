<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ProjectOS 4-Layer System Architecture</title>
  <desc id="arch-desc">Four-layer architecture diagram showing Layer 1 (Developer and AI Coding Agent), Layer 2 (ProjectOS MCP Server, ts-morph, Git CLI, and Local Repository), Layer 3 (Express 5 REST API, Project Brain Logic, Zod Validation, and SQLite Database), and Layer 4 (React Web Dashboard with Project Brain View, Impact Graph, and AI Git Timeline), including the local vs shared deployment boundary.</desc>
  <defs>
    <style>
      .bg { fill: #090D16; }
      .frame { fill: none; stroke: #1E293B; stroke-width: 2; }
      .col-bg { fill: #0C1322; stroke: #1E293B; stroke-width: 1.5; }
      .col-l1 { stroke: #6366F1; }
      .col-l2 { stroke: #F59E0B; }
      .col-l3 { stroke: #38BDF8; }
      .col-l4 { stroke: #10B981; }
      .node-card { fill: #111A2E; stroke: #263554; stroke-width: 1.25; }
      .node-highlight-p { fill: #151936; stroke: #6366F1; stroke-width: 1.5; }
      .node-highlight-a { fill: #1C1917; stroke: #F59E0B; stroke-width: 1.5; }
      .node-highlight-c { fill: #0F2238; stroke: #38BDF8; stroke-width: 1.5; }
      .node-highlight-e { fill: #0B2625; stroke: #10B981; stroke-width: 1.5; }
      .boundary-local { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .boundary-shared { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .text-main { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-dim { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .wire-mcp { fill: none; stroke: #A5B4FC; stroke-width: 2; }
      .wire-rest { fill: none; stroke: #38BDF8; stroke-width: 2; }
      .wire-auth { fill: none; stroke: #34D399; stroke-width: 2; }
      .wire-local { fill: none; stroke: #FBBF24; stroke-width: 1.75; }
      .wire-internal { fill: none; stroke: #64748B; stroke-width: 1.5; }
    </style>
    <marker id="m-mcp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A5B4FC"/>
    </marker>
    <marker id="m-rest" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="m-auth" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="m-local" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="m-int" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1160" height="560" rx="14" class="bg"/>

  <!-- Top Header Banner -->
  <text x="32" y="34" class="text-main" font-size="16" font-weight="700">ProjectOS System Architecture &amp; Deployment Boundaries</text>
  <text x="32" y="54" class="text-muted" font-size="12">Four decoupled layers connected via Model Context Protocol (MCP) and authenticated REST boundaries.</text>

  <!-- DEPLOYMENT BOUNDARY BOXES -->
  <!-- Local Machine Boundary -->
  <rect x="24" y="70" width="542" height="466" rx="12" class="boundary-local"/>
  <rect x="38" y="61" width="290" height="20" rx="4" fill="#1E293B"/>
  <text x="183" y="75" text-anchor="middle" fill="#CBD5E1" class="text-mono" font-size="10" font-weight="700">LOCAL DEVELOPER WORKSTATION BOUNDARY</text>

  <!-- Shared / Cloud Boundary -->
  <rect x="594" y="70" width="542" height="466" rx="12" class="boundary-shared"/>
  <rect x="610" y="61" width="356" height="20" rx="4" fill="#1E293B"/>
  <text x="788" y="75" text-anchor="middle" fill="#CBD5E1" class="text-mono" font-size="10" font-weight="700">APPLICATION SERVICE BOUNDARY (LOCAL OR AWS EC2 + EBS)</text>

  <!-- ================================================================= -->
  <!-- LAYER 1: DEVELOPER + AI AGENT -->
  <!-- ================================================================= -->
  <g transform="translate(38, 94)">
    <rect x="0" y="0" width="234" height="426" rx="10" class="col-bg col-l1"/>
    <rect x="0" y="0" width="234" height="38" rx="10" fill="#1E1B4B"/>
    <text x="16" y="24" fill="#A5B4FC" class="text-mono" font-size="11" font-weight="700">01 • DEVELOPER + AGENT</text>

    <!-- Developer Node -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="202" height="106" rx="8" class="node-card"/>
      <text x="14" y="22" fill="#A5B4FC" class="text-mono" font-size="9.5" font-weight="700">HUMAN AUTHORITY</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">Software Developer</text>
      <text x="14" y="62" class="text-muted" font-size="11">• Prompts coding tasks in IDE</text>
      <text x="14" y="78" class="text-muted" font-size="11">• Reviews impact &amp; approves</text>
      <text x="14" y="94" class="text-muted" font-size="11">• Reviews code &amp; runs git commit</text>
    </g>

    <!-- Connector Dev -> Agent -->
    <line x1="117" y1="162" x2="117" y2="196" class="wire-internal" marker-end="url(#m-int)"/>
    <text x="125" y="183" class="text-dim text-mono" font-size="9.5">Prompts / Edits</text>

    <!-- AI Coding Agent Node -->
    <g transform="translate(16, 198)">
      <rect x="0" y="0" width="202" height="136" rx="8" class="node-highlight-p"/>
      <text x="14" y="22" fill="#818CF8" class="text-mono" font-size="9.5" font-weight="700">EXTERNAL MCP CLIENT</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">AI Coding Agent</text>
      <text x="14" y="60" class="text-muted text-mono" font-size="10">Claude Code / Codex / Antigravity</text>
      <line x1="14" y1="70" x2="188" y2="70" stroke="#263554" stroke-width="1"/>
      <text x="14" y="88" class="text-muted" font-size="11">• Queries Project Brain via MCP</text>
      <text x="14" y="104" class="text-muted" font-size="11">• Submits pending proposals</text>
      <text x="14" y="120" class="text-muted" font-size="11">• Cannot self-approve decisions</text>
    </g>

    <!-- Provider Neutrality Note -->
    <g transform="translate(16, 352)">
      <rect x="0" y="0" width="202" height="56" rx="6" fill="#090D16" stroke="#1E293B"/>
      <text x="12" y="20" fill="#94A3B8" class="text-mono" font-size="9.5" font-weight="700">AGENT-AGNOSTIC</text>
      <text x="12" y="36" class="text-dim" font-size="10.5">No proprietary ProjectOS LLM;</text>
      <text x="12" y="49" class="text-dim" font-size="10.5">uses connected agent's model.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- LAYER 2: MCP SERVER + LOCAL REPOSITORY -->
  <!-- ================================================================= -->
  <g transform="translate(316, 94)">
    <rect x="0" y="0" width="236" height="426" rx="10" class="col-bg col-l2"/>
    <rect x="0" y="0" width="236" height="38" rx="10" fill="#451A03"/>
    <text x="16" y="24" fill="#FCD34D" class="text-mono" font-size="11" font-weight="700">02 • MCP + REPOSITORY</text>

    <!-- ProjectOS MCP Server -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="204" height="106" rx="8" class="node-highlight-a"/>
      <text x="14" y="22" fill="#FBBF24" class="text-mono" font-size="9.5" font-weight="700">OFFICIAL TYPESCRIPT MCP SDK</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">ProjectOS MCP Server</text>
      <text x="14" y="62" class="text-muted" font-size="11">• Standardized agent tool surface</text>
      <text x="14" y="78" class="text-muted" font-size="11">• Orchestrates local code scans</text>
      <text x="14" y="94" class="text-muted" font-size="11">• Syncs metadata with backend</text>
    </g>

    <!-- Local Analysis Engines: ts-morph + Git CLI -->
    <g transform="translate(16, 198)">
      <rect x="0" y="0" width="96" height="96" rx="8" class="node-card"/>
      <text x="10" y="20" fill="#38BDF8" class="text-mono" font-size="9" font-weight="700">STATIC AST</text>
      <text x="10" y="38" class="text-main" font-size="13" font-weight="700">ts-morph</text>
      <text x="10" y="56" class="text-muted" font-size="10">JS/TS imports,</text>
      <text x="10" y="70" class="text-muted" font-size="10">references &amp;</text>
      <text x="10" y="84" class="text-muted" font-size="10">dependencies</text>
    </g>

    <g transform="translate(124, 198)">
      <rect x="0" y="0" width="96" height="96" rx="8" class="node-card"/>
      <text x="10" y="20" fill="#F97316" class="text-mono" font-size="9" font-weight="700">VCS ENGINE</text>
      <text x="10" y="38" class="text-main" font-size="13" font-weight="700">Git CLI</text>
      <text x="10" y="56" class="text-muted" font-size="10">Real commit</text>
      <text x="10" y="70" class="text-muted" font-size="10">hashes, diffs</text>
      <text x="10" y="84" class="text-muted" font-size="10">&amp; file history</text>
    </g>

    <!-- Connectors MCP -> Engines -->
    <path d="M 80 162 L 64 194" class="wire-local" marker-end="url(#m-local)"/>
    <path d="M 156 162 L 172 194" class="wire-local" marker-end="url(#m-local)"/>

    <!-- Local Git Repository -->
    <g transform="translate(16, 326)">
      <rect x="0" y="0" width="204" height="82" rx="8" class="node-card"/>
      <text x="14" y="22" fill="#CBD5E1" class="text-mono" font-size="9.5" font-weight="700">ON-DISK SOURCE TREE</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">Local Git Repository</text>
      <text x="14" y="60" class="text-muted" font-size="10.5">Source files remain local; remote</text>
      <text x="14" y="74" class="text-muted" font-size="10.5">backend never reads raw disk.</text>
    </g>

    <!-- Connectors Engines -> Repo -->
    <line x1="64" y1="294" x2="64" y2="322" class="wire-local" marker-end="url(#m-local)"/>
    <line x1="172" y1="294" x2="172" y2="322" class="wire-local" marker-end="url(#m-local)"/>
  </g>

  <!-- ================================================================= -->
  <!-- LAYER 3: BACKEND + DATABASE -->
  <!-- ================================================================= -->
  <g transform="translate(608, 94)">
    <rect x="0" y="0" width="236" height="426" rx="10" class="col-bg col-l3"/>
    <rect x="0" y="0" width="236" height="38" rx="10" fill="#0C4A6E"/>
    <text x="16" y="24" fill="#7DD3FC" class="text-mono" font-size="11" font-weight="700">03 • BACKEND + DATABASE</text>

    <!-- Express REST API -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="204" height="92" rx="8" class="node-highlight-c"/>
      <text x="14" y="22" fill="#38BDF8" class="text-mono" font-size="9.5" font-weight="700">NODE.JS + EXPRESS 5</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">Express REST API</text>
      <text x="14" y="62" class="text-muted" font-size="11">• Shared state coordination</text>
      <text x="14" y="78" class="text-muted" font-size="11">• Enforces approval authority</text>
    </g>

    <!-- Zod + Auth & Project Brain Service -->
    <g transform="translate(16, 174)">
      <rect x="0" y="0" width="204" height="62" rx="8" class="node-card"/>
      <text x="14" y="20" fill="#7DD3FC" class="text-mono" font-size="9" font-weight="700">BOUNDARY SECURITY</text>
      <text x="14" y="38" class="text-main" font-size="12.5" font-weight="700">Zod + Express Sessions</text>
      <text x="14" y="53" class="text-muted" font-size="10">Schema validation &amp; human auth</text>
    </g>

    <g transform="translate(16, 250)">
      <rect x="0" y="0" width="204" height="62" rx="8" class="node-card"/>
      <text x="14" y="20" fill="#A5B4FC" class="text-mono" font-size="9" font-weight="700">DOMAIN ENGINE</text>
      <text x="14" y="38" class="text-main" font-size="12.5" font-weight="700">Project Brain Logic</text>
      <text x="14" y="53" class="text-muted" font-size="10">Decision states, reports &amp; links</text>
    </g>

    <!-- SQLite Database -->
    <g transform="translate(16, 336)">
      <rect x="0" y="0" width="204" height="72" rx="8" class="node-highlight-c"/>
      <text x="14" y="20" fill="#38BDF8" class="text-mono" font-size="9.5" font-weight="700">PERSISTENT RELATIONAL STORE</text>
      <text x="14" y="39" class="text-main" font-size="13.5" font-weight="700">SQLite Database</text>
      <text x="14" y="57" class="text-muted" font-size="10.5">Decisions, proposals, impact</text>
      <text x="14" y="68" class="text-muted" font-size="10.5">metadata &amp; commit links (EBS)</text>
    </g>

    <!-- Internal Backend Connectors -->
    <line x1="118" y1="148" x2="118" y2="170" class="wire-internal" marker-end="url(#m-int)"/>
    <line x1="118" y1="236" x2="118" y2="248" class="wire-internal" marker-end="url(#m-int)"/>
    <line x1="118" y1="312" x2="118" y2="332" class="wire-internal" marker-end="url(#m-int)"/>
  </g>

  <!-- ================================================================= -->
  <!-- LAYER 4: WEB DASHBOARD -->
  <!-- ================================================================= -->
  <g transform="translate(888, 94)">
    <rect x="0" y="0" width="234" height="426" rx="10" class="col-bg col-l4"/>
    <rect x="0" y="0" width="234" height="38" rx="10" fill="#064E3B"/>
    <text x="16" y="24" fill="#6EE7B7" class="text-mono" font-size="11" font-weight="700">04 • WEB DASHBOARD</text>

    <!-- React Dashboard Host -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="202" height="76" rx="8" class="node-highlight-e"/>
      <text x="14" y="22" fill="#34D399" class="text-mono" font-size="9.5" font-weight="700">REACT + TYPESCRIPT + VITE</text>
      <text x="14" y="42" class="text-main" font-size="14" font-weight="700">Human Review Surface</text>
      <text x="14" y="60" class="text-muted" font-size="10.5">Authenticated governance UI</text>
    </g>

    <!-- View 1: Project Brain View -->
    <g transform="translate(16, 156)">
      <rect x="0" y="0" width="202" height="74" rx="8" class="node-card"/>
      <text x="14" y="20" fill="#A5B4FC" class="text-mono" font-size="9" font-weight="700">GOVERNANCE VIEW</text>
      <text x="14" y="38" class="text-main" font-size="12.5" font-weight="700">Project Brain View</text>
      <text x="14" y="54" class="text-muted" font-size="10">Inspect proposals; authorize</text>
      <text x="14" y="66" class="text-muted" font-size="10">human Approve / Reject actions</text>
    </g>

    <!-- View 2: Impact Graph -->
    <g transform="translate(16, 244)">
      <rect x="0" y="0" width="202" height="74" rx="8" class="node-card"/>
      <text x="14" y="20" fill="#FCD34D" class="text-mono" font-size="9" font-weight="700">REACT FLOW CANVAS</text>
      <text x="14" y="38" class="text-main" font-size="12.5" font-weight="700">Impact Graph</text>
      <text x="14" y="54" class="text-muted" font-size="10">Visual dependency &amp; conflict</text>
      <text x="14" y="66" class="text-muted" font-size="10">map (Verified vs AI Predicted)</text>
    </g>

    <!-- View 3: AI Git Timeline -->
    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="202" height="74" rx="8" class="node-card"/>
      <text x="14" y="20" fill="#6EE7B7" class="text-mono" font-size="9" font-weight="700">PROVENANCE EXPLORER</text>
      <text x="14" y="38" class="text-main" font-size="12.5" font-weight="700">AI Git Timeline</text>
      <text x="14" y="54" class="text-muted" font-size="10">Bidirectional commit, diff &amp;</text>
      <text x="14" y="66" class="text-muted" font-size="10">decision rationale timeline</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- INTER-LAYER PROTOCOL BRIDGES -->
  <!-- ================================================================= -->
  <!-- Bridge 1: Agent <-> MCP Server (MCP Protocol) -->
  <path d="M 254 335 L 294 335 L 294 202 L 328 202" class="wire-mcp" marker-end="url(#m-mcp)" marker-start="url(#m-mcp)"/>
  <rect x="268" y="252" width="52" height="22" rx="4" fill="#1E1B4B" stroke="#6366F1"/>
  <text x="294" y="267" text-anchor="middle" fill="#C7D2FE" class="text-mono" font-size="10" font-weight="700">MCP</text>

  <!-- Bridge 2: MCP Server <-> Express REST API (REST / HTTPS) -->
  <path d="M 536 196 L 620 196" class="wire-rest" marker-end="url(#m-rest)" marker-start="url(#m-rest)"/>
  <rect x="546" y="168" width="68" height="22" rx="4" fill="#0C4A6E" stroke="#0284C7"/>
  <text x="580" y="183" text-anchor="middle" fill="#BAE6FD" class="text-mono" font-size="9.5" font-weight="700">REST API</text>

  <!-- Bridge 3: Express REST API <-> Web Dashboard (Authenticated REST + Sessions) -->
  <path d="M 828 196 L 900 196" class="wire-auth" marker-end="url(#m-auth)" marker-start="url(#m-auth)"/>
  <rect x="832" y="168" width="68" height="22" rx="4" fill="#064E3B" stroke="#059669"/>
  <text x="866" y="183" text-anchor="middle" fill="#A7F3D0" class="text-mono" font-size="9.5" font-weight="700">AUTH REST</text>

  <rect x="1" y="1" width="1158" height="558" rx="13" class="frame"/>
</svg>
